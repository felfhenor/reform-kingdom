<div class="game-container relative">
  @switch (activeGamePlayView()) {
    @case ('kingdom') {
      <app-game-play-kingdom class="absolute inset-0"></app-game-play-kingdom>
    }
    @default {
      <app-game-play-world class="absolute inset-0"></app-game-play-world>
    }
  }
</div>

<ng-container [appTeleportOutlet]="'menu-options'"></ng-container>
