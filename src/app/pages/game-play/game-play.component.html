<div class="game-container relative">
  <!--
    The world view stays mounted (and its Pixi app running) even while the
    kingdom view is shown, instead of being destroyed/recreated on every
    switch. `invisible` keeps its layout box - and therefore its correct
    size for the Pixi canvas - intact while hidden, unlike `hidden`.
  -->
  <app-game-play-world
    class="absolute inset-0"
    [class.invisible]="activeGamePlayView() !== 'world'"
  ></app-game-play-world>

  <app-game-play-kingdom
    class="absolute inset-0"
    [class.hidden]="activeGamePlayView() !== 'kingdom'"
  ></app-game-play-kingdom>

  <app-game-play-heroes
    class="absolute inset-0"
    [class.hidden]="activeGamePlayView() !== 'heroes'"
  ></app-game-play-heroes>

  <app-play-adventurelog
    class="absolute inset-0"
    [class.hidden]="activeGamePlayView() !== 'adventurelog'"
  ></app-play-adventurelog>

  <app-game-play-decree
    class="absolute inset-0"
    [class.hidden]="activeGamePlayView() !== 'decree'"
  ></app-game-play-decree>

  @if (isPaused()) {
    <div
      class="pause-vignette absolute inset-0 pointer-events-none flex items-start justify-center pt-8"
      aria-hidden="true"
    >
      @if (activeGamePlayView() === 'world') {
        <div
          class="flex items-center justify-center text-lighter w-full h-full"
        >
          <div class="pt-[96px] flex items-center gap-2">
            <app-icon name="gamePauseButton" size="1.5em"></app-icon>
            <span class="text-lg uppercase">Paused</span>
          </div>
        </div>
      }
    </div>
  }
</div>

<ng-container [appTeleportOutlet]="'menu-options'"></ng-container>
