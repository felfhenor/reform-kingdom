<div class="flex h-screen flex-col gap-4 overflow-y-auto p-4">
  <div class="card bg-base-100 foreground shadow-xl">
    <div class="card-body gap-4">
      <h1 class="text-2xl font-bold">Icon Catalog</h1>
    </div>
  </div>

  <div class="card bg-base-100 foreground shadow-xl">
    <div class="card-body gap-4">
      <div class="card-title">Stats</div>

      <div class="grid grid-cols-4 gap-4">
        @for (stat of stats; track stat) {
          <div
            class="flex flex-row flex-wrap items-center gap-2 rounded-box bg-base-200 p-2"
          >
            @for (size of sizes; track size) {
              <app-icon-stat
                [stat]="stat"
                [size]="size"
                [tp]="size + ' (' + sizeValues[size] + ')'"
              />
            }

            <span>{{ stat }}</span>
          </div>
        }
      </div>
    </div>
  </div>

  @for (category of iconCategories; track category.title) {
    <div class="card bg-base-100 foreground shadow-xl">
      <div class="card-body gap-4">
        <div class="card-title">{{ category.title }}</div>

        <div class="grid grid-cols-4 gap-4">
          @for (entry of category.entries; track entry.name) {
            <div
              class="flex flex-row flex-wrap items-center gap-2 rounded-box bg-base-200 p-2"
            >
              @for (size of sizes; track size) {
                <app-icon
                  [name]="entry.icon"
                  [size]="size"
                  [tp]="size + ' (' + sizeValues[size] + ')'"
                />
              }

              <span>{{ entry.name }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  }
</div>
