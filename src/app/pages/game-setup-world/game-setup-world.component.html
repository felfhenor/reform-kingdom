<div class="flex justify-center items-center h-full p-2 flex-col gap-2">
  <div class="w-full lg:max-w-[800px]">
    <div class="card bg-base-100">
      <div class="card-body items-center justify-between">
        <div
          class="card-title w-full flex justify-between items-center relative min-h-8"
        >
          <div class="absolute flex justify-center w-full pointer-events-none">
            Choose Your Party
          </div>

          <div></div>

          <button
            class="btn btn-sm btn-outline"
            (click)="randomize()"
            appSfx="ui-click"
            [sfxTrigger]="['click', 'hover']"
          >
            Randomize
          </button>
        </div>

        <div class="card-actions pt-3 flex flex-col gap-6 w-full">
          @for (heroField of partyForm; track $index) {
            @let jobId = heroField.jobId().value();
            @let jobData = jobFor(jobId);

            <div class="flex flex-row gap-2 w-full">
              <app-icon-job [job]="jobData"></app-icon-job>

              <div class="flex flex-col gap-2 flex-1">
                <div class="flex flex-row gap-2">
                  <input
                    type="text"
                    class="input input-bordered flex-1"
                    [formField]="heroField.name"
                    placeholder="Hero name"
                  />

                  <ng-select
                    class="flex-1"
                    [items]="unlockedJobs()"
                    bindLabel="name"
                    bindValue="id"
                    [clearable]="false"
                    [formField]="heroField.jobId"
                  ></ng-select>
                </div>

                @if (jobData) {
                  <div class="my-2">
                    <app-row-item-stats
                      [containerClasses]="['grid', 'grid-cols-5', 'gap-2']"
                      [stats]="jobData.baseStats"
                      layout="row"
                      [maxDecimals]="0"
                      [showSign]="false"
                    />
                  </div>
                }

                <div class="text-sm text-lighter">
                  {{ jobData?.description }}
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="w-full lg:max-w-[800px]">
    <div class="card bg-base-100">
      <div class="card-body items-center justify-between">
        <button
          class="btn btn-primary btn-block"
          [disabled]="partyForm().invalid()"
          (click)="createWorld()"
          appSfx="ui-click"
          [sfxTrigger]="['click', 'hover']"
        >
          Start Game
        </button>
      </div>
    </div>
  </div>
</div>
