@if (rows().length > 0) {
  <!-- flex-col-reverse stacks row 0 (nearest the hero row) at the bottom. -->
  <div class="flex flex-col-reverse gap-2 pointer-events-auto">
    @for (row of rows(); track $index) {
      <div class="flex items-end gap-2">
        @for (entry of row; track entry.combatantId) {
          <app-card-status-combatant
            [entry]="entry"
            [expanded]="expanded()"
            (animate.enter)="onEnter($event)"
          ></app-card-status-combatant>
        }
      </div>
    }
  </div>
}
