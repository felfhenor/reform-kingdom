<button
  type="button"
  class="btn btn-sm btn-primary"
  [disabled]="!canDevelop()"
  (click)="develop.emit()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  @if (isMaxLevel()) {
    This location is fully developed
  } @else {
    Develop for
    <app-row-currency-cost [costs]="cost()" />
  }
</button>
