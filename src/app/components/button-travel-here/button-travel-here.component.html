@let eta = etaLabel();

@if (eta !== undefined) {
  <button type="button" class="btn btn-xs btn-neutral tabular-nums" disabled>
    {{ eta }}
  </button>
} @else {
  <button
    type="button"
    class="btn btn-xs btn-neutral"
    [disabled]="!canTravel()"
    (click)="travel()"
    ffButton="ui-click"
    [ffPadAction]="padAction()"
    [ffPadLabel]="'buttonTravelHere.travelHere' | t"
  >
    {{ 'buttonTravelHere.travelHere' | t }}
  </button>
}
