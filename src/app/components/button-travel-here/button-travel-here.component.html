@let eta = etaLabel();

@if (eta !== undefined) {
  <button type="button" class="btn btn-xs btn-neutral tabular-nums" disabled>
    {{ eta }}
  </button>
} @else {
  <button
    type="button"
    class="btn btn-xs btn-neutral"
    [disabled]="!canTravel()"
    (click)="travel()"
    appSfx="ui-click"
    [sfxTrigger]="['click', 'hover']"
  >
    Travel Here
  </button>
}
