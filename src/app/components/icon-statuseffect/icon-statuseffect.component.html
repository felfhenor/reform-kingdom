@let e = effect();
@let buff = isBuff();

<ng-template #tooltip>
  <app-tooltip-statuseffect [effect]="e" />
</ng-template>

<div
  class="relative flex bg-black/60 border"
  [class.border-success]="buff"
  [class.border-error]="!buff"
  [tp]="tooltip"
  [tpPlacement]="'top'"
>
  <app-atlas-image
    class="zoom-inline"
    spritesheet="statuseffect"
    [assetName]="e.sprite"
  />
  <span class="statuseffect-turns tabular-nums">
    {{ e.turnsRemaining | number }}
  </span>
</div>
