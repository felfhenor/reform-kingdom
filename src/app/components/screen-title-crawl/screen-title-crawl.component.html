<div
  class="crawl"
  [class.crawl-paused]="isPaused()"
  [class.crawl-fading]="isFadingOut()"
  (animationend)="onFadeEnd($event)"
>
  <div class="crawl-viewport">
    <div
      class="crawl-text"
      [style.animation-duration.s]="crawlSeconds()"
      (animationend)="onScrollEnd()"
    >
      @for (paragraph of paragraphs(); track $index) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </div>

  @if (!isFadingOut()) {
    <button
      type="button"
      class="absolute bottom-4 right-4 overflow-hidden text-white btn btn-sm btn-ghost"
      (pointerdown)="startSkipHold()"
      (pointerup)="cancelSkipHold()"
      (pointerleave)="cancelSkipHold()"
      ffButton="ui-click"
    >
      @if (isGamepadMode()) {
        <ff-input-prompt action="confirm" />
        {{ 'screenTitleCrawl.holdToSkip' | t }}
      } @else {
        {{ 'screenTitleCrawl.holdSpaceToSkip' | t }}
      }
      <span
        class="absolute bottom-0 left-0 h-0.5 bg-white"
        [style.width.%]="skipProgress() * 100"
      ></span>
    </button>
  }
</div>
