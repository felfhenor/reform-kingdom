<div class="absolute inset-0 bg-black/60"></div>

<div class="relative flex h-full items-center justify-center p-4">
  <app-panel-combat-scene
    #scene
    class="w-full max-w-[1440px] max-h-full"
    [liveCombat]="liveCombat()"
    [log]="log()"
    [paused]="isPaused()"
    (confirmed)="confirm($event)"
  >
    <app-icon
      sceneHelp
      name="gameHelp"
      size="inline"
      class="text-lighter absolute top-4 right-4"
      [tp]="tooltip"
      [tpPlacement]="'left'"
    />

    @if (isPaused() && !scene.isReview()) {
      <button
        sceneStatusAction
        type="button"
        class="btn btn-sm cursor-pointer"
        (click)="resume()"
        appSfx="ui-click"
        [sfxTrigger]="['click', 'hover']"
      >
        {{ 'overlayCombatOrders.resume' | t }}
      </button>
    }

    @if (scene.isReview()) {
      <button
        sceneActions
        type="button"
        class="btn btn-primary cursor-pointer"
        (click)="close()"
        appSfx="ui-click"
        [sfxTrigger]="['click', 'hover']"
      >
        {{ 'overlayCombatOrders.close' | t }}
      </button>
    } @else {
      <button
        sceneActions
        type="button"
        class="btn btn-error cursor-pointer"
        [disabled]="scene.isResolving()"
        (click.shift)="flee()"
        (click)="$event.shiftKey || fleeSwal.fire()"
        appSfx="ui-error"
        [sfxTrigger]="['click', 'hover']"
      >
        {{ 'overlayCombatOrders.flee' | t }}
      </button>
    }
  </app-panel-combat-scene>
</div>

<ng-template #tooltip>
  <p>
    {{ 'overlayCombatOrders.turnsGoInThe' | t }}
  </p>

  <p class="mt-2">
    {{ 'overlayCombatOrders.multiTargetSkillsPick' | t }}
  </p>

  <p class="mt-2">
    {{ 'overlayCombatOrders.previouslyUsedSkillsHave' | t }}
  </p>
</ng-template>

<swal
  #fleeSwal
  [title]="'overlayCombatOrders.fleeThisFight' | t"
  [text]="'overlayCombatOrders.yourHeroesSkipThe' | t"
  icon="warning"
  [confirmButtonText]="'overlayCombatOrders.yesFlee' | t"
  [cancelButtonText]="'overlayCombatOrders.noKeepFighting' | t"
  (confirm)="flee()"
></swal>
