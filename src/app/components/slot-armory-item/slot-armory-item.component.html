@let item = equipment();

<app-tooltip-item-preview
  #preview
  [display]="display()"
  [bonusStats]="infusionBonus()"
>
  <div class="text-xs my-2 flex items-center gap-2">
    Sell value:
    <app-currency-cost [type]="goldCoinItemId" [amount]="sellValue()" />
  </div>

  @if (item.slots > 0) {
    <app-row-infused-materials
      [infusedItemIds]="equipmentItem().infusedItemIds"
      [maxSlots]="item.slots"
    />
  }
</app-tooltip-item-preview>

<div
  class="armory-item-slot outline-2 outline-offset-[-2px] rounded outline-{{
    item.rarity
  }}"
  [class.armory-item-slot-sellable]="sellMode()"
  [class.armory-item-slot-dimmed]="sellMode() && !selected()"
  [class.armory-item-slot-selected]="sellMode() && selected()"
  [tp]="preview.template()"
  [tpPlacement]="'top'"
  (click)="onClick($event)"
>
  <app-slot-icon-blank>
    <app-atlas-image spritesheet="equipment" [assetName]="item.sprite" />
  </app-slot-icon-blank>
</div>
