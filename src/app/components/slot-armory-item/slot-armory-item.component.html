@let item = equipment();

<app-tooltip-item-preview
  #preview
  [display]="display()"
  [bonusStats]="bonusStats()"
  [bonusResistances]="bonusResistances()"
  [bonusCombatStats]="bonusCombatStats()"
>
  @for (skill of grantedSkills(); track skill.id) {
    <div class="text-xs mb-1 italic text-lighter flex items-center gap-2">
      Teaches
      <span class="zoom-inline">
        <app-slot-icon-blank [showBackground]="false">
          <app-atlas-image spritesheet="skill" [assetName]="skill.sprite" />
        </app-slot-icon-blank>
      </span>
      {{ skill.name }}
    </div>
  }

  <div class="text-xs my-2 flex items-center gap-2">
    Sell value:
    <app-currency-cost [type]="goldCoinItemId" [amount]="sellValue()" />
  </div>

  @if (infusionSlotCount() > 0) {
    <app-row-infused-materials
      [infusedItemIds]="equipmentItem().infusedItemIds"
      [maxSlots]="infusionSlotCount()"
    />
  }
</app-tooltip-item-preview>

<div
  class="armory-item-slot"
  [class.armory-item-slot-sellable]="sellMode()"
  [class.armory-item-slot-dimmed]="sellMode() && !selected()"
  [class.armory-item-slot-selected]="sellMode() && selected()"
  [tp]="preview.template()"
  [tpPlacement]="'top'"
  (click)="onClick($event)"
>
  <app-slot-rarity-outline
    [entry]="item"
    spritesheet="equipment"
  ></app-slot-rarity-outline>
</div>
