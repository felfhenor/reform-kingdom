<app-page-paged-grid
  #grid
  [entries]="materials()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name or description..."
  emptyMessage="No materials found."
>
  <span header>Storage</span>

  @for (entry of grid.pagedEntries(); track $index + ' ' + entry.item.id) {
    <app-slot-storage-item [entry]="entry" />
  }
</app-page-paged-grid>
