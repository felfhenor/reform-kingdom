<app-paged-grid-page
  #grid
  [entries]="materials()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name or description..."
  emptyMessage="No materials found."
>
  <span header>Storage</span>

  @for (entry of grid.pagedEntries(); track entry.item.id) {
    <app-storage-item-slot [entry]="entry" />
  }
</app-paged-grid-page>
