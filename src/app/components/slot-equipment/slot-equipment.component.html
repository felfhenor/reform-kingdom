@let content = equippedContent();

<button
  type="button"
  class="relative flex items-center justify-center cursor-pointer overflow-hidden bg-gray-400 {{
    content ? 'outline-' + content.rarity : 'outline-gray-500'
  }}"
  [class.outline-2]="!isSelected()"
  [class.outline-4]="isSelected()"
  (click)="slotClick.emit()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  @if (!content) {
    <app-slot-icon-blank>
      <span
        class="absolute inset-0 flex items-center justify-center text-center text-xs leading-tight pointer-events-none text-lighter"
      >
        {{ slot() }}
      </span>
    </app-slot-icon-blank>
  }

  @if (content) {
    <app-tooltip-item-preview
      #preview
      [display]="display()"
      [bonusStats]="bonusStats()"
      [bonusResistances]="bonusResistances()"
      [bonusCombatStats]="bonusCombatStats()"
      [showEquippableBy]="false"
      [showDescription]="false"
    >
      @if (occupiedPaperdollSlots().length > 1) {
        <div class="type-meta mb-1">
          Occupies: {{ occupiedPaperdollSlots().join(' + ') }}
        </div>
      }

      @if (infusionSlotCount() > 0) {
        <app-row-infused-materials
          [infusedItemIds]="equippedItem()!.infusedItemIds"
          [maxSlots]="infusionSlotCount()"
        />
      }

      @if (showUnequipHint()) {
        <div class="type-hint mt-2">Right-click to unequip.</div>
      }
    </app-tooltip-item-preview>

    <!-- A multi-slot item's secondary slot is faded so it reads as the same item, not a second piece. -->
    <app-atlas-image
      [tp]="content ? preview.template() : undefined"
      [tpPlacement]="'top'"
      spritesheet="equipment"
      [assetName]="content.sprite"
      class="relative z-10"
      [class.opacity-50]="isSecondarySlot()"
    />
  }
</button>
