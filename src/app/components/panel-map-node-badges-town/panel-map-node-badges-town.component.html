@if (scaleType(); as scale) {
  <div class="badge badge-info badge-outline">{{ scale }}</div>
}

@if (reputationTierName(); as tierName) {
  <div class="badge badge-secondary badge-outline">{{ tierName }}</div>
}

@if (raidCountdown(); as countdown) {
  <div class="badge badge-error badge-outline">Raid in {{ countdown }}</div>
}
