@let content = equipment();

<button
  type="button"
  class="equipment-item-row hover:bg-base-300"
  [class.equipment-item-row-disabled]="disabled()"
  [attr.aria-disabled]="disabled() ? true : null"
  [tp]="tooltip"
  [tpPlacement]="'right'"
  [tpVariation]="equippedDisplay() ? 'itemComparison' : undefined"
  (click)="onEquipClick()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  <app-slot-rarity-outline
    class="equipment-item-row-icon"
    [entry]="content"
    spritesheet="equipment"
  ></app-slot-rarity-outline>

  <span class="equipment-item-row-info">
    <span class="equipment-item-row-name text-{{ content.rarity }}">
      {{ displayName() }}
      <span class="equipment-item-row-level text-lighter"></span>
      (Lv. {{ content.levelRequirement }})
    </span>

    <span class="equipment-item-row-stats">
      @for (stat of rowStatKeys(); track stat) {
        @let equipStatValue = totalStatValue(stat);

        <span
          class="equipment-item-row-stat"
          [class.text-value-positive]="bonusStats()[stat] > 0"
          [class.text-value-negative]="bonusStats()[stat] < 0"
        >
          <app-icon-stat [stat]="stat" />
          <span>{{ statShorthand[stat] }}</span>
          <span>{{ equipStatValue | statDisplay: 1 }}</span>
        </span>
      }
    </span>
  </span>
</button>

<ng-template #tooltip>
  @if (equippedDisplay(); as equipped) {
    <div class="flex gap-4 p-3">
      <div class="flex-1 min-w-0">
        <div class="italic text-xs mb-1">Currently Equipped</div>
        <app-detail-item-preview
          [display]="equipped"
          [comparisonStats]="equippedComparisonStats()"
          [comparisonResistances]="equippedComparisonResistances()"
          [comparisonCombatStats]="equippedComparisonCombatStats()"
          [showEquippableBy]="false"
          [showDescription]="false"
        >
          @if (equippedInfusionSlotCount() > 0) {
            <app-row-infused-materials
              [infusedItemIds]="equippedItem()!.infusedItemIds"
              [maxSlots]="equippedInfusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>

      <div class="flex-1 min-w-0">
        <div class="italic text-xs mb-1">This Item</div>
        <app-detail-item-preview
          [display]="display()"
          [comparisonStats]="thisItemComparisonStats()"
          [comparisonResistances]="thisItemComparisonResistances()"
          [comparisonCombatStats]="thisItemComparisonCombatStats()"
          [showEquippableBy]="false"
          [showDescription]="false"
        >
          @if (infusionSlotCount() > 0) {
            <app-row-infused-materials
              [infusedItemIds]="equipmentItem().infusedItemIds"
              [maxSlots]="infusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>
    </div>
  } @else {
    <div class="p-3">
      <app-detail-item-preview
        [display]="display()"
        [showEquippableBy]="false"
        [showDescription]="false"
      >
        @if (infusionSlotCount() > 0) {
          <app-row-infused-materials
            [infusedItemIds]="equipmentItem().infusedItemIds"
            [maxSlots]="infusionSlotCount()"
          />
        }
      </app-detail-item-preview>
    </div>
  }
</ng-template>
