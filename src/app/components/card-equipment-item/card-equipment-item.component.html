@let content = equipment();

<button
  appListRow
  [disabled]="disabled()"
  [tp]="tooltip"
  [tpVariation]="equippedDisplay() ? 'itemComparison' : undefined"
  (click)="equip.emit()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  <app-slot-rarity-outline
    class="shrink-0"
    [entry]="content"
    spritesheet="equipment"
  ></app-slot-rarity-outline>

  <span class="flex flex-col items-start gap-2 min-w-0">
    <span
      class="type-entity-name truncate max-w-full text-{{ content.rarity }}"
    >
      {{ display().name }}
    </span>

    @let item = display();
    <app-row-stat-summary
      layout="row"
      [maxDecimals]="1"
      [stats]="item.stats"
      [bonusStats]="item.bonusStats"
      [resistances]="item.resistances"
      [bonusResistances]="item.bonusResistances"
      [combatStats]="item.combatStats"
      [bonusCombatStats]="item.bonusCombatStats"
      [monsterTypeDamage]="item.monsterTypeDamage"
      [bonusMonsterTypeDamage]="item.bonusMonsterTypeDamage"
      [elementalResistances]="item.elementalResistances"
      [bonusElementalResistances]="item.bonusElementalResistances"
      [elementalBoons]="item.elementalBoons"
      [bonusElementalBoons]="item.bonusElementalBoons"
    />
  </span>
</button>

<ng-template #tooltip>
  @if (equippedDisplay(); as equipped) {
    <div class="flex gap-4 p-3">
      <div class="flex-1 min-w-0">
        <div class="type-meta mb-2">Currently Equipped</div>
        <app-detail-item-preview
          [display]="equipped"
          [comparisonStats]="equippedComparisonStats()"
          [comparisonResistances]="equippedComparisonResistances()"
          [comparisonCombatStats]="equippedComparisonCombatStats()"
          [comparisonMonsterTypeDamage]="equippedComparisonMonsterTypeDamage()"
          [comparisonElementalResistances]="
            equippedComparisonElementalResistances()
          "
          [comparisonElementalBoons]="equippedComparisonElementalBoons()"
        >
          @if (equippedItem(); as equippedItemValue) {
            <app-row-equipment-sell-value [item]="equippedItemValue" />
          }

          @if (equippedInfusionSlotCount() > 0) {
            <app-row-infused-materials
              class="block mt-2"
              [infusedItemIds]="equippedItem()!.infusedItemIds"
              [maxSlots]="equippedInfusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>

      <div class="flex-1 min-w-0">
        <div class="type-meta mb-2">This Item</div>
        <app-detail-item-preview
          [display]="display()"
          [comparisonStats]="thisItemComparisonStats()"
          [comparisonResistances]="thisItemComparisonResistances()"
          [comparisonCombatStats]="thisItemComparisonCombatStats()"
          [comparisonMonsterTypeDamage]="thisItemComparisonMonsterTypeDamage()"
          [comparisonElementalResistances]="
            thisItemComparisonElementalResistances()
          "
          [comparisonElementalBoons]="thisItemComparisonElementalBoons()"
        >
          <app-row-equipment-sell-value [item]="equipmentItem()" />

          @if (infusionSlotCount() > 0) {
            <app-row-infused-materials
              class="block mt-2"
              [infusedItemIds]="equipmentItem().infusedItemIds"
              [maxSlots]="infusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>
    </div>
  } @else {
    <div class="p-3">
      <app-detail-item-preview [display]="display()">
        <app-row-equipment-sell-value [item]="equipmentItem()" />

        @if (infusionSlotCount() > 0) {
          <app-row-infused-materials
            [infusedItemIds]="equipmentItem().infusedItemIds"
            [maxSlots]="infusionSlotCount()"
          />
        }
      </app-detail-item-preview>
    </div>
  }
</ng-template>
