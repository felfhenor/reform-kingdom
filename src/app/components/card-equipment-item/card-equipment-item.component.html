@let content = equipment();

<button
  appListRow
  [disabled]="disabled()"
  [tp]="tooltip"
  [tpVariation]="equippedDisplay() ? 'itemComparison' : undefined"
  (click)="equip.emit()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  <app-slot-rarity-outline
    class="shrink-0"
    [entry]="content"
    spritesheet="equipment"
  ></app-slot-rarity-outline>

  <span class="flex flex-col items-start gap-2 min-w-0">
    <span class="font-semibold truncate max-w-full text-{{ content.rarity }}">
      {{ displayName() }}
    </span>

    <app-row-item-stats
      [stats]="equipment().baseStats"
      [bonusStats]="bonusStats()"
      layout="row"
      [showShorthand]="false"
      [maxDecimals]="1"
    />
  </span>
</button>

<ng-template #tooltip>
  @if (equippedDisplay(); as equipped) {
    <div class="flex gap-4 p-3">
      <div class="flex-1 min-w-0">
        <div class="italic text-xs mb-1">Currently Equipped</div>
        <app-detail-item-preview
          [display]="equipped"
          [comparisonStats]="equippedComparisonStats()"
          [comparisonResistances]="equippedComparisonResistances()"
          [comparisonCombatStats]="equippedComparisonCombatStats()"
          [comparisonMonsterTypeDamage]="equippedComparisonMonsterTypeDamage()"
          [showEquippableBy]="false"
          [showDescription]="false"
        >
          @if (equippedInfusionSlotCount() > 0) {
            <app-row-infused-materials
              [infusedItemIds]="equippedItem()!.infusedItemIds"
              [maxSlots]="equippedInfusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>

      <div class="flex-1 min-w-0">
        <div class="italic text-xs mb-1">This Item</div>
        <app-detail-item-preview
          [display]="display()"
          [comparisonStats]="thisItemComparisonStats()"
          [comparisonResistances]="thisItemComparisonResistances()"
          [comparisonCombatStats]="thisItemComparisonCombatStats()"
          [comparisonMonsterTypeDamage]="thisItemComparisonMonsterTypeDamage()"
          [showEquippableBy]="false"
          [showDescription]="false"
        >
          @if (infusionSlotCount() > 0) {
            <app-row-infused-materials
              [infusedItemIds]="equipmentItem().infusedItemIds"
              [maxSlots]="infusionSlotCount()"
            />
          }
        </app-detail-item-preview>
      </div>
    </div>
  } @else {
    <div class="p-3">
      <app-detail-item-preview
        [display]="display()"
        [showEquippableBy]="false"
        [showDescription]="false"
      >
        @if (infusionSlotCount() > 0) {
          <app-row-infused-materials
            [infusedItemIds]="equipmentItem().infusedItemIds"
            [maxSlots]="infusionSlotCount()"
          />
        }
      </app-detail-item-preview>
    </div>
  }
</ng-template>
