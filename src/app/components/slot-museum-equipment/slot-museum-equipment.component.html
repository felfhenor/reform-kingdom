@let e = entry();

@if (e.discovered) {
  <div
    class="relative w-[64px] h-[64px] cursor-default"
    [tp]="tooltip"
    [tpPlacement]="'top'"
  >
    <app-slot-rarity-outline
      [entry]="e.equipment"
      spritesheet="equipment"
    ></app-slot-rarity-outline>
  </div>
} @else if (e.discoveredButNotMade) {
  <div
    class="relative w-[64px] h-[64px] cursor-default opacity-50"
    [tp]="tooltip"
    [tpPlacement]="'top'"
  >
    <app-slot-rarity-outline
      [entry]="e.equipment"
      spritesheet="equipment"
    ></app-slot-rarity-outline>
  </div>
} @else {
  <div [tp]="tooltip" [tpPlacement]="'top'" class="opacity-50">
    <app-icon-unknown />
  </div>
}

<ng-template #tooltip>
  <div class="max-w-[400px]">
    @if (e.discovered) {
      <app-detail-item-preview [display]="display()">
        <ng-container [ngTemplateOutlet]="sourceLine" />
      </app-detail-item-preview>
    } @else {
      <div class="p-2">
        <div class="type-unknown mb-1">???</div>
        <ng-container [ngTemplateOutlet]="sourceLine" />
      </div>
    }
  </div>
</ng-template>

<ng-template #sourceLine>
  @if (e.sourceNodeNames.length > 0) {
    <div class="text-xs mt-2">Source: {{ e.sourceNodeNames.join(', ') }}</div>
  } @else {
    <div class="text-xs mt-2">Source unknown</div>
  }
</ng-template>
