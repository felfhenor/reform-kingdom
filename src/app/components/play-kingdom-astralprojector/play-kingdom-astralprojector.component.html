<app-card-page heightProfile="full">
  <span header>Astral Projector</span>

  <app-button-kingdom-back pageactions />

  <div class="flex flex-col gap-2 p-4 h-full overflow-y-auto">
    @for (row of rows(); track row.content.id) {
      <div
        class="flex items-center gap-2 p-2 rounded bg-base-200 min-h-24 lg:min-h-0"
      >
        <div class="w-16 h-16 relative flex-shrink-0">
          @if (row.effect) {
            <app-slot-rarity-outline
              [entry]="row.effect"
              spritesheet="globaleffect"
            ></app-slot-rarity-outline>
          }
        </div>

        <div
          class="flex-1 flex flex-col lg:flex-row lg:items-center gap-2 min-w-0"
        >
          <div class="flex flex-col gap-2 min-w-0 lg:w-128 lg:shrink-0">
            <span
              class="type-entity-name truncate text-{{ row.effect.rarity }}"
            >
              {{ row.content.name }}
            </span>
            <span class="type-meta truncate">
              {{ row.effect.description }}
            </span>
          </div>

          <div class="flex flex-wrap gap-2 lg:flex-1">
            @for (material of row.materialEntries; track $index) {
              <app-slot-requirement
                [content]="material.discovered ? material.content : undefined"
                spritesheet="item"
                [owned]="material.owned"
                [quantity]="material.quantity"
                [tooltip]="materialTooltip(material)"
              />
            }
          </div>
        </div>

        <div
          class="flex flex-col lg:flex-row items-end lg:items-center gap-2 flex-shrink-0"
        >
          <span class="type-meta lg:w-20 lg:shrink-0 lg:text-center">
            {{ row.durationLabel }}
          </span>

          <button
            class="btn btn-xs btn-primary"
            [disabled]="!row.castable"
            (click)="onCastClick(row.content)"
            appSfx="ui-click"
            [sfxOffset]="$index"
            [sfxTrigger]="['click', 'hover']"
          >
            Cast
          </button>
        </div>
      </div>
    } @empty {
      <app-blank-slate>No spells have been unlocked yet.</app-blank-slate>
    }
  </div>
</app-card-page>

<swal
  #overwriteSwal
  title="Overwrite active spell?"
  [text]="
    'Casting this will end ' +
    (overwriteTargetName() ?? 'the active spell') +
    '. Continue?'
  "
  icon="warning"
  confirmButtonText="Yes, cast it"
  cancelButtonText="Cancel"
  (confirm)="confirmCast()"
></swal>
