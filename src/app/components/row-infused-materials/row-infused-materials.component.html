<div class="flex flex-wrap gap-2">
  @for (slot of slots(); track slot.index) {
    <div
      class="relative w-8 h-8 shrink-0 cursor-pointer"
      [class.ring-2]="selectedSlotIndex() === slot.index"
      [class.ring-primary]="selectedSlotIndex() === slot.index"
      [tp]="slotTooltip"
      [tpPlacement]="'top'"
      (click)="slotClick.emit(slot.index)"
    >
      <div class="zoom-row">
        <app-slot-icon-blank>
          @if (slot.content) {
            <app-atlas-image
              spritesheet="item"
              [assetName]="slot.content.sprite"
            />
          }
        </app-slot-icon-blank>
      </div>
    </div>

    <ng-template #slotTooltip>
      @if (slot.content) {
        <div class="p-2">
          <div class="font-bold mb-1 text-{{ slot.content.rarity }}">
            {{ slot.content.name }}
          </div>
          @if (isInfusable(slot.content)) {
            <app-row-item-stats [stats]="slot.content.infusionStats!" />
          }
        </div>
      } @else {
        <div class="p-2 text-xs italic">Empty infusion slot</div>
      }
    </ng-template>
  }
</div>
