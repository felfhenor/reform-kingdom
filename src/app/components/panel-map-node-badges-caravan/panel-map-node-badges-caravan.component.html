@let counts = tradeCounts();

@if (traderLevel(); as level) {
  <div class="badge badge-info">Trader Lv. {{ level }}</div>
}

@if (counts.buyable > 0) {
  <div class="badge badge-success">{{ counts.buyable }} Buyable</div>
}

@if (counts.sellable > 0) {
  <div class="badge badge-warning">{{ counts.sellable }} Sellable</div>
}
