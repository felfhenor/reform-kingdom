@for (bonus of bonuses(); track bonus.tradeskillName) {
  <div class="text-xs flex items-center gap-2">
    <span class="zoom-inline">
      <app-slot-icon-blank [showBackground]="false">
        <app-atlas-image
          spritesheet="tradeskill"
          [assetName]="bonus.tradeskillSprite"
        />
      </app-slot-icon-blank>
    </span>

    <span class="ml-[4px]">
      {{
        'rowGatherYieldBonuses.materialGatherYield'
          | t
            : {
                tradeskillName: bonus.tradeskillName,
                value: (bonus.value | number),
              }
      }}
    </span>
  </div>
}
