<app-card-page heightProfile="full">
  <span header>
    <ng-content select="[header]" />
  </span>

  <app-button-kingdom-back pageactions />

  <div class="paged-grid-page">
    <ng-content select="[before-toolbar]" />

    @if (showToolbar()) {
      <div class="paged-grid-toolbar">
        <div class="paged-grid-toolbar-search">
          <input
            type="text"
            [placeholder]="searchPlaceholder()"
            class="input input-sm input-bordered w-full max-w-xs"
            [value]="searchText()"
            (input)="onSearchInput($event)"
          />

          <ng-content select="[toolbar-actions]" />
        </div>

        @if (totalPages() > 1) {
          <div class="paged-grid-pagination">
            <button
              type="button"
              class="btn btn-xs"
              aria-label="Previous page"
              [disabled]="page() === 0"
              (click)="prevPage()"
              appSfx="ui-click"
              [sfxOffset]="0"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-icon name="tablerChevronLeft" size="row" />
            </button>

            <span class="min-w-[100px]">
              Page {{ page() + 1 }} / {{ totalPages() }}
            </span>

            <button
              type="button"
              class="btn btn-xs"
              aria-label="Next page"
              [disabled]="page() >= totalPages() - 1"
              (click)="nextPage()"
              appSfx="ui-click"
              [sfxOffset]="0"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-icon name="tablerChevronRight" size="row" />
            </button>
          </div>
        }
      </div>
    }

    <div class="paged-grid-grid p-2" #gridContainer>
      @if (showGrid()) {
        @if (pagedEntries().length === 0) {
          <app-blank-slate class="paged-grid-empty">
            {{ emptyMessage() }}
          </app-blank-slate>
        }

        <ng-content />
      } @else {
        <ng-content select="[custom]" />
      }
    </div>
  </div>
</app-card-page>
