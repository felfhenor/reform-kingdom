<app-card-page heightProfile="full">
  <span header>
    <ng-content select="[header]" />
  </span>

  <app-button-kingdom-back pageactions />

  @if (showToolbar()) {
    <div pageactionssecondary>
      <input
        type="text"
        [placeholder]="searchPlaceholder()"
        class="input input-sm input-bordered search-bar"
        [value]="searchText()"
        (input)="onSearchInput($event)"
      />
    </div>
  }

  <div class="flex flex-col gap-2 h-full">
    <ng-content select="[before-toolbar]" />

    @if (showToolbar()) {
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 w-full">
          <ng-content select="[toolbar-actions]" />
        </div>

        @if (totalPages() > 1) {
          <div class="flex items-center gap-2">
            <button
              type="button"
              class="btn btn-xs"
              aria-label="Previous page"
              [disabled]="page() === 0"
              (click)="prevPage()"
              appSfx="ui-click"
              [sfxOffset]="0"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-icon name="tablerChevronLeft" size="row" />
            </button>

            <span class="min-w-[100px]">
              Page {{ page() + 1 }} / {{ totalPages() }}
            </span>

            <button
              type="button"
              class="btn btn-xs"
              aria-label="Next page"
              [disabled]="page() >= totalPages() - 1"
              (click)="nextPage()"
              appSfx="ui-click"
              [sfxOffset]="0"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-icon name="tablerChevronRight" size="row" />
            </button>
          </div>
        }
      </div>
    }

    @if (showGrid() && pagedEntries().length === 0) {
      <app-blank-slate
        class="text-center w-full flex items-center justify-center"
      >
        {{ emptyMessage() }}
      </app-blank-slate>
    }

    <div
      class="flex-1 grid content-start justify-items-center overflow-hidden grid-cols-[repeat(auto-fill,64px)] auto-rows-[64px] gap-2 p-2"
      #gridContainer
      appListReflow
      [appListReflowEnabled]="reflow()"
    >
      @if (showGrid()) {
        <ng-content />
      } @else {
        <ng-content select="[custom]" />
      }
    </div>
  </div>
</app-card-page>
