@if (node(); as entry) {
  <div class="map-node-panel card bg-base-100 shadow-xl pointer-events-auto">
    <div class="card-body gap-2 p-4">
      <div class="flex items-start justify-between gap-2">
        <div class="flex items-center gap-2">
          <div class="node-sprite-frame rounded-box bg-base-200">
            @if (spriteFrame(); as frame) {
              <img
                [src]="frame.imagePath"
                alt=""
                class="node-sprite"
                [style.width.px]="frame.width"
                [style.height.px]="frame.height"
                [style.object-position]="'-' + frame.x + 'px -' + frame.y + 'px'"
                draggable="false"
              />
            }
          </div>

          <h2 class="card-title text-lg">{{ entry.nodeName }}</h2>
        </div>

        <app-button-close (click)="close()"></app-button-close>
      </div>

      <div class="flex gap-2 text-sm">
        <div class="badge badge-outline">Level {{ levelLabel() }}</div>
        <div class="badge badge-outline">
          Monsters {{ monsterCount() ?? '—' }}
        </div>
      </div>

      <p class="text-sm opacity-80">
        {{ description() ?? 'No information available yet.' }}
      </p>
    </div>
  </div>
}
