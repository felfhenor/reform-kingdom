<div class="flex flex-row gap-4">
  <div class="flex-1 flex flex-col gap-4">
    <div class="card shadow-sm">
      <div class="card-body p-3 gap-2">
        <div class="type-section-title">
          {{ 'panelOptionsAccessibility.visuals' | t }}
        </div>

        <div class="form-control">
          <label class="label label-option">
            <span class="label-text">
              {{ 'panelOptionsAccessibility.uiScale' | t }}
              <app-icon
                name="gameHelp"
                size="inline"
                class="text-lighter"
                [tp]="'panelOptionsAccessibility.scalesTheWorldScreen' | t"
                [tpPlacement]="'top'"
              />
            </span>
            <ng-select
              ffSelect
              [items]="uiScaleChoices"
              bindLabel="label"
              bindValue="value"
              [clearable]="false"
              [searchable]="false"
              [(ngModel)]="uiScale"
              (ngModelChange)="setOption('uiScale', $event)"
            ></ng-select>
          </label>
        </div>

        <div class="form-control">
          <label class="label label-option">
            <span class="label-text">
              {{ 'panelOptionsAccessibility.mapZoom' | t }}
              <app-icon
                name="gameHelp"
                size="inline"
                class="text-lighter"
                [tp]="'panelOptionsAccessibility.zoomsInOnThe' | t"
                [tpPlacement]="'top'"
              />
            </span>
            <ng-select
              ffSelect
              [items]="mapZoomChoices"
              bindLabel="label"
              bindValue="value"
              [clearable]="false"
              [searchable]="false"
              [(ngModel)]="mapZoom"
              (ngModelChange)="setOption('mapZoom', $event)"
            ></ng-select>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-option">
            <span class="label-text">
              {{ 'panelOptionsAccessibility.cleanFont' | t }}
            </span>
            <input
              type="checkbox"
              [checked]="getOption('cleanFont')"
              class="checkbox"
              (click)="setOption('cleanFont', !getOption('cleanFont'))"
            />
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-option">
            <span class="label-text">
              {{ 'panelOptionsAccessibility.colorblindFriendly' | t }}
              <app-icon
                name="gameHelp"
                size="inline"
                class="text-lighter"
                [tp]="'panelOptionsAccessibility.replacesRedGreenColor' | t"
                [tpPlacement]="'top'"
              />
            </span>
            <input
              type="checkbox"
              [checked]="getOption('colorblindMode')"
              class="checkbox"
              (click)="
                setOption('colorblindMode', !getOption('colorblindMode'))
              "
            />
          </label>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-3 gap-2">
        <div class="type-section-title">
          {{ 'panelOptionsAccessibility.motion' | t }}
        </div>

        <div class="form-control">
          <label class="label label-option">
            <span class="label-text">
              {{ 'panelOptionsAccessibility.reduceMotion' | t }}
              <app-icon
                name="gameHelp"
                size="inline"
                class="text-lighter"
                [tp]="
                  'panelOptionsAccessibility.removesSlidingBouncingShaking' | t
                "
                [tpPlacement]="'top'"
              />
            </span>
            <ng-select
              ffSelect
              [items]="motionChoices()"
              bindLabel="label"
              bindValue="value"
              [clearable]="false"
              [searchable]="false"
              [(ngModel)]="motionPreference"
              (ngModelChange)="setOption('motionPreference', $event)"
            ></ng-select>
          </label>
        </div>
      </div>
    </div>
  </div>
</div>
