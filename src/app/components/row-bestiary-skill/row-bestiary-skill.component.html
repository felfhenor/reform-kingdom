@let s = skill();

<app-tooltip-skill-preview
  #preview
  [display]="s"
  [displayCombatant]="usingCombatant()"
/>

<div
  class="flex items-center gap-2"
  [tp]="preview.template()"
  [tpPlacement]="'left'"
>
  <div class="zoom-row shrink-0">
    <app-slot-rarity-outline
      [entry]="s"
      spritesheet="skill"
    ></app-slot-rarity-outline>
  </div>
  <span class="text-xs truncate text-{{ s.rarity }}">{{ s.name }}</span>
</div>
