<div class="flex flex-row gap-2">
  <div class="flex-1 flex flex-col">
    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Timers</div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <span class="label-text !ml-0 mr-2">Tick Multiplier</span>
            <input
              #tickMultiplier
              type="range"
              [min]="1"
              [max]="100"
              [value]="getOption('debugTickMultiplier')"
              (change)="
                setOption('debugTickMultiplier', tickMultiplier.valueAsNumber)
              "
              class="range range-secondary"
            />
            <span class="ml-2">{{ getOption('debugTickMultiplier') }}x</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <span class="label-text !ml-0 mr-2">Save Interval</span>
            <input
              #saveInterval
              type="range"
              [min]="1"
              [max]="60"
              [value]="getOption('debugSaveInterval')"
              (change)="
                setOption('debugSaveInterval', saveInterval.valueAsNumber)
              "
              class="range range-secondary"
            />
            <span class="ml-2">{{ getOption('debugSaveInterval') }}s</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl">
      <div class="card-body">
        <div class="card-title">Console Options</div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('debugConsoleLogStateUpdates') === true"
              class="checkbox checkbox-secondary"
              appAnalyticsClick="Options:Debug:LogStateUpdates"
              (click)="
                setOption(
                  'debugConsoleLogStateUpdates',
                  !getOption('debugConsoleLogStateUpdates')
                )
              "
            />
            <span class="label-text">Log state updates</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('debugGameloopTimerUpdates') === true"
              class="checkbox checkbox-secondary"
              appAnalyticsClick="Options:Debug:LogTimerUpdates"
              (click)="
                setOption(
                  'debugGameloopTimerUpdates',
                  !getOption('debugGameloopTimerUpdates')
                )
              "
            />
            <span class="label-text">Log long (>100ms) gameloop timers</span>
          </label>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Game Options</div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('debugAllowBackgroundOperations') === true"
              class="checkbox checkbox-secondary"
              appAnalyticsClick="Options:Debug:AllowBackgroundOperations"
              (click)="
                setOption(
                  'debugAllowBackgroundOperations',
                  !getOption('debugAllowBackgroundOperations')
                )
              "
            />
            <span class="label-text">Allow Background Operations</span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="flex-1">
    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Give Item / Equipment</div>

        <div class="debug-give-grid">
          <span class="label-text text-right">Item</span>
          <ng-select
            class="debug-give-select"
            [items]="debugItems()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select an item..."
            [(ngModel)]="selectedItemId"
          ></ng-select>
          <input
            type="number"
            [min]="1"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="itemQuantity"
          />
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:GiveItem"
            (click)="giveItem()"
          >
            Give
          </button>

          <span class="label-text text-right">Equipment</span>
          <ng-select
            class="debug-give-select"
            [items]="debugEquipment()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select equipment..."
            [(ngModel)]="selectedEquipmentId"
          ></ng-select>
          <input
            type="number"
            [min]="1"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="equipmentQuantity"
          />
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:GiveEquipment"
            (click)="giveEquipment()"
          >
            Give
          </button>

          <span class="label-text text-right">Collectible</span>
          <ng-select
            class="debug-give-select"
            [items]="debugCollectibles()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select a collectible..."
            [(ngModel)]="selectedCollectibleId"
          ></ng-select>
          <input
            type="number"
            [min]="1"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="collectibleQuantity"
          />
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:GiveCollectible"
            (click)="giveCollectible()"
          >
            Give
          </button>

          <span class="label-text text-right">Recipe</span>
          <ng-select
            class="debug-give-select"
            [items]="debugDropGatedRecipes()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select a recipe..."
            [(ngModel)]="selectedRecipeId"
          ></ng-select>
          <span></span>
          <button
            type="button"
            class="btn btn-warning debug-give-btn"
            appAnalyticsClick="Options:Debug:UndiscoverRecipe"
            (click)="undiscoverRecipe()"
          >
            Unlearn
          </button>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Set Hero Level</div>

        <div class="debug-give-grid">
          <span class="label-text text-right">Hero</span>
          <ng-select
            class="debug-give-select"
            [items]="party()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select a hero..."
            [(ngModel)]="selectedCharacterId"
          ></ng-select>
          <input
            type="number"
            [min]="1"
            [max]="characterMaxLevel"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="characterLevel"
          />
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:SetCharacterLevel"
            (click)="setCharacterLevel()"
          >
            Set
          </button>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Set Tradeskill Level</div>

        <div class="debug-give-grid">
          <span class="label-text text-right">Tradeskill</span>
          <ng-select
            class="debug-give-select"
            [items]="tradeskills"
            [clearable]="false"
            placeholder="Select a tradeskill..."
            [(ngModel)]="selectedTradeskill"
          ></ng-select>
          <input
            type="number"
            [min]="1"
            [max]="tradeskillMaxLevel"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="tradeskillLevel"
          />
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:SetTradeskillLevel"
            (click)="setTradeskillLevel()"
          >
            Set
          </button>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Workers</div>

        <div class="debug-give-grid">
          <span class="label-text text-right">Worker</span>
          <ng-select
            class="debug-give-select"
            [items]="debugWorkers()"
            bindLabel="name"
            bindValue="id"
            [clearable]="false"
            placeholder="Select a worker..."
            [(ngModel)]="selectedWorkerId"
          ></ng-select>

          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:RescueWorker"
            (click)="rescueWorker()"
          >
            Rescue
          </button>

          <span></span>

          <span class="label-text text-right">Worker Level</span>

          <input
            type="number"
            [min]="1"
            [max]="workerMaxLevel"
            class="input input-bordered debug-give-qty"
            [(ngModel)]="workerLevel"
          />

          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:SetWorkerLevel"
            (click)="setWorkerLevel()"
          >
            Set
          </button>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Gather Nodes</div>

        <div class="debug-give-grid">
          <span class="label-text text-right">Gather Node</span>
          <ng-select
            class="debug-give-select"
            [items]="debugGatherNodes()"
            [clearable]="false"
            placeholder="Select a gather node..."
            [(ngModel)]="selectedGatherNodeName"
          ></ng-select>
          <span></span>
          <button
            type="button"
            class="btn btn-secondary debug-give-btn"
            appAnalyticsClick="Options:Debug:DiscoverGatherNode"
            (click)="discoverGatherNode()"
          >
            Discover
          </button>
        </div>
      </div>
    </div>

    <div class="card bg-base-100 foreground shadow-xl mt-3">
      <div class="card-body">
        <div class="card-title">Reset</div>

        <button
          type="button"
          class="btn btn-warning btn-sm"
          appAnalyticsClick="Options:Debug:ResetBestiary"
          (click)="resetBestiary()"
        >
          Reset Bestiary
        </button>
        <button
          type="button"
          class="btn btn-warning btn-sm"
          appAnalyticsClick="Options:Debug:ResetCommissions"
          (click)="resetCommissions()"
        >
          Reset Commissions
        </button>
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          appAnalyticsClick="Options:Debug:FillBestiary"
          (click)="fillBestiary()"
        >
          Fill Bestiary
        </button>
        <button
          type="button"
          class="btn btn-secondary btn-sm"
          appAnalyticsClick="Options:Debug:DiscoverAllRecipes"
          (click)="discoverAllRecipes()"
        >
          Discover All Recipes
        </button>
      </div>
    </div>
  </div>
</div>
