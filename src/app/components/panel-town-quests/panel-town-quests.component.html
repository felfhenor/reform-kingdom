@let questRows = commissions();

<div class="card-body p-3 gap-2 flex-1 min-h-0">
  <h2 class="card-title text-base justify-between shrink-0">
    Commissions
    <span class="badge badge-sm badge-info tabular-nums">
      {{ questRows.length | number }}
    </span>
  </h2>

  <div class="flex-1 min-h-0 overflow-y-auto">
    <div class="flex flex-col gap-2 pr-2">
      @for (row of questRows; track row.slotId) {
        <app-slot-commission
          [row]="row"
          [fulfill]="() => fulfillCommission(row)"
          (travel)="travelToTown()"
        />
      } @empty {
        <app-blank-slate>No commissions are available yet.</app-blank-slate>
      }
    </div>
  </div>
</div>
