<app-card-page heightProfile="full">
  <span header>Heroes</span>

  <span pageactionssecondary>
    <app-slot-button-container
      [disabled]="!equipmentModifiable()"
      [helpText]="'This cannot be done in combat.'"
    >
      <button
        type="button"
        class="btn btn-primary btn-sm"
        (click)="optimizeAll()"
        appSfx="ui-click"
        [disabled]="!equipmentModifiable()"
        [tp]="'Optimizing your equipment will automatically equip the best equipment for each hero, based on their class and the stat priorities that class has.'"
        [sfxTrigger]="['click', 'hover']"
      >
        Optimize All
      </button>
    </app-slot-button-container>
  </span>

  <div class="h-full flex flex-col gap-4">
    @if (party().length === 0) {
      <app-blank-slate size="page">No heroes yet.</app-blank-slate>
    } @else {
      <div role="tablist" class="tabs tabs-boxed">
        @for (character of party(); track character.id) {
          <button
            type="button"
            role="tab"
            class="tab gap-2"
            [class.tab-active]="character.id === selectedCharacterId()"
            [class.font-bold]="character.id === selectedCharacterId()"
            (click)="selectCharacter(character.id)"
            appSfx="ui-click"
            [sfxOffset]="$index"
            [sfxTrigger]="['click', 'hover']"
          >
            @let job = jobFor(character.jobId);

            <div class="hero-tab-icon">
              <app-icon-job [job]="job" />
            </div>
            {{ character.name }}
            <span class="text-lighter">
              Lv. {{ character.level }} {{ job?.shorthand ?? 'JOB' }}
            </span>
          </button>
        }
      </div>

      @if (selectedCharacter(); as character) {
        <app-panel-hero-equipment
          [character]="character"
          class="flex-1 min-h-0"
        />
      }
    }
  </div>
</app-card-page>
