@if (activeSubview() === 'regalia') {
  @defer (on immediate) {
    <app-play-heroes-regalia />
  } @placeholder {
    <app-page-blank />
  }
} @else if (activeSubview() === 'skilltree') {
  @defer (on immediate) {
    <app-play-heroes-skill-tree />
  } @placeholder {
    <app-page-blank />
  }
} @else {
  <app-card-page heightProfile="full">
    <span header>Heroes</span>

    <span pageactionssecondary class="flex gap-2">
      <app-slot-button-container
        [disabled]="!equipmentModifiable()"
        [helpText]="'Optimize all of your heroes gear. This cannot be done in combat.'"
      >
        <button
          type="button"
          class="btn btn-primary btn-sm"
          (click)="optimizeAll()"
          appSfx="ui-click"
          [disabled]="!equipmentModifiable()"
          [tp]="'Optimizing your equipment will automatically equip the best equipment for each hero, based on their class and the stat priorities that class has.'"
          [sfxTrigger]="['click', 'hover']"
        >
          Optimize All
        </button>
      </app-slot-button-container>
    </span>

    <div class="h-full flex flex-col gap-4">
      @if (party().length === 0) {
        <app-blank-slate size="page">No heroes yet.</app-blank-slate>
      } @else {
        <app-tabs-hero
          [party]="party()"
          [selectedId]="selectedCharacterId()"
          (selected)="selectCharacter($event)"
        />

        @if (selectedCharacter(); as character) {
          <app-panel-hero-equipment
            [character]="character"
            class="flex-1 min-h-0"
          />
        }
      }
    </div>
  </app-card-page>
}
