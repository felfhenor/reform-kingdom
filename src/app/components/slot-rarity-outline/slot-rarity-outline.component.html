<app-slot-icon-blank>
  <app-icon-item-preview
    [spritesheet]="spritesheet()"
    [sprite]="entry().sprite"
    [backdropSprite]="backdropSprite()"
  />

  <ng-content></ng-content>

  <span class="label-text bottom-0 right-0 px-1">
    <ng-content select="[text-br]"></ng-content>
  </span>

  <span class="label-banner top-0">
    <ng-content select="[text-banner-top]"></ng-content>
  </span>

  <span class="label-banner bottom-0">
    <ng-content select="[text-banner-bottom]"></ng-content>
  </span>

  <span class="badge bg-black/70">
    <ng-content select="[badge-br]"></ng-content>
  </span>

  <span class="badge bg-red-500">
    <ng-content select="[badge-br-unmet]"></ng-content>
  </span>
</app-slot-icon-blank>
