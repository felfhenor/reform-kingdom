<app-card-page heightProfile="full">
  <span header>Commissions</span>

  <div pageactions class="flex items-center gap-2">
    <app-button-kingdom-back />
  </div>

  <div class="flex flex-col gap-4 p-4 h-full overflow-y-auto">
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="font-semibold">Caravans</span>
        <span class="text-sm text-lighter">
          Next commissions in {{ resetLabel() }}
        </span>
      </div>

      @for (row of caravanRows(); track row.caravanId) {
        <app-slot-commission
          [row]="row"
          [fulfill]="() => fulfillCaravan(row)"
          (travel)="travelTo(row.nodeName)"
        />
      } @empty {
        <div class="text-sm text-lighter italic">
          You have no active caravan commissions (somehow).
        </div>
      }
    </div>

    @if (townRows().length > 0) {
      <div class="flex flex-col gap-2">
        <span class="font-semibold">Towns</span>

        @for (row of townRows(); track row.slotId) {
          <app-slot-commission
            [row]="row"
            [fulfill]="() => fulfillTown(row)"
            (travel)="travelTo(row.nodeName)"
          />
        }
      </div>
    }
  </div>
</app-card-page>
