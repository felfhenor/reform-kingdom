<app-card-page
  heightProfile="full"
  appTutorialTarget="kingdom-subview-commissions"
>
  <span header>Commissions</span>

  <div pageactions class="flex items-center gap-2">
    <app-button-kingdom-back />
  </div>

  <div class="flex flex-col gap-4 p-4 h-full overflow-y-auto">
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <span class="type-section-title">Caravans</span>
        <span class="type-muted">Next commissions in {{ resetLabel() }}</span>
      </div>

      @for (row of caravanRows(); track row.caravanId) {
        <app-slot-commission
          [row]="row"
          [fulfill]="() => fulfillCaravan(row)"
          (travel)="travelTo(row.nodeName)"
        />
      } @empty {
        <app-blank-slate>
          You have no active caravan commissions.
        </app-blank-slate>
      }
    </div>

    @if (townRows().length > 0) {
      <div class="flex flex-col gap-2">
        <span class="type-section-title">Towns</span>

        @for (row of townRows(); track row.slotId) {
          <app-slot-commission
            [row]="row"
            [fulfill]="() => fulfillTown(row)"
            (travel)="travelTo(row.nodeName)"
          />
        }
      </div>
    }
  </div>
</app-card-page>
