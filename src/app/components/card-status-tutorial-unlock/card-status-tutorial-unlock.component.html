@let data = entry();

<button
  type="button"
  class="block"
  appButtonGlow
  (click)="select()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  <app-card-status-bubble [expanded]="expanded()" [name]="data.name">
    <app-icon bubbleIcon name="gameHelp" size="nav" />
    <span bubbleSubtitle class="type-meta truncate">New feature unlocked</span>
  </app-card-status-bubble>
</button>
