@if (hasLegend()) {
  <div class="flex flex-col gap-1">
    <span class="type-label">{{ legendName() }}</span>
    @for (verse of verses(); track $index) {
      <p class="type-flavor">{{ verse }}</p>
    }
    @if (hasMoreVerses()) {
      <p class="type-hint">Develop this shrine to learn more of its legend.</p>
    }
  </div>
}
