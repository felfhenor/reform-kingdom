@let c = charging();

<app-tooltip-skill-preview
  #preview
  [display]="c.skill"
  [displayCombatant]="c.caster"
  [footer]="footer"
/>

<ng-template #footer>
  <div class="type-meta mt-2">
    {{ 'skill.firesIn' | tPlural: c.turnsRemaining }}
  </div>
</ng-template>

<div
  class="ff-inspect-tip relative flex bg-black/60 border border-dashed border-base-content"
  [tp]="preview.template()"
  [tpPlacement]="'top'"
>
  <app-atlas-image
    class="zoom-inline"
    spritesheet="skill"
    [assetName]="c.skill.sprite"
  />
  <span
    class="absolute -right-0.5 -bottom-0.5 font-bold text-white leading-none pointer-events-none text-xs text-shadow-black tabular-nums"
  >
    {{ c.turnsRemaining | number }}
  </span>
</div>
