@let entry = row();
@let item = display();

<app-tooltip-item-preview #preview [display]="item">
  <div preview-footer class="mt-2 italic text-center">
    {{
      isPartyBuying()
        ? 'This caravan is selling this item to you.'
        : 'This caravan is buying this item from you.'
    }}
  </div>
</app-tooltip-item-preview>

<button
  type="button"
  class="caravan-trade-slot btn btn-outline btn-neutral h-auto w-full normal-case font-normal gap-2 text-neutral-content text-start"
  [disabled]="entry.soldOut || entry.maxQuantity === 0 || hasEnoughGoldToBuy()"
  [tp]="item ? preview.template() : undefined"
  [tpPlacement]="'top'"
  (click)="activate.emit()"
>
  @if (item) {
    <div class="flex flex-col items-center gap-1 shrink-0">
      <div
        class="outline-2 outline-offset-[-2px] rounded outline-{{
          item.rarity
        }}"
      >
        <app-slot-icon-blank>
          <app-icon-item-preview
            [sprite]="item.sprite"
            [spritesheet]="item.spritesheet"
            [backdropSprite]="item.backdropSprite"
          />
        </app-slot-icon-blank>
      </div>
    </div>

    <div class="flex flex-col flex-1 min-w-0 gap-1">
      <span class="font-bold text-{{ item.rarity }} truncate">
        {{ item.name }}
      </span>

      <div class="flex items-center gap-2 flex-wrap">
        @if (!entry.soldOut) {
          <span
            class="badge badge-sm"
            [class.badge-success]="isPartyBuying()"
            [class.badge-warning]="!isPartyBuying()"
          >
            {{ isPartyBuying() ? 'Buy' : 'Sell' }}
          </span>
        }

        @if (entry.ownedQuantity > 0) {
          <span class="badge badge-sm badge-info badge-outline">
            Owned: {{ entry.ownedQuantity }}
          </span>
        }

        @let remaining = entry.remaining ?? 0;

        @if (remaining > 0) {
          <span class="badge badge-sm badge-info badge-outline">
            Trades Remaining: {{ remaining }}
          </span>
        }

        @if (entry.soldOut) {
          <span class="badge badge-error badge-sm">Sold out</span>
        }
      </div>
    </div>

    <app-currency-cost
      [type]="goldCoinItemId"
      [amount]="entry.price"
      class="ml-auto mr-2 shrink-0"
    />
  }
</button>
