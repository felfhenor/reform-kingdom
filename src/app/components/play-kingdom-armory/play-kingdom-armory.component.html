<app-card-page heightProfile="full">
  <span header>Armory</span>

  <div pageactions>
    <button class="btn btn-sm" (click)="back()">Back</button>
  </div>

  <div class="armory-page">
    <div class="armory-toolbar">
      <input
        type="text"
        placeholder="Search by name or description..."
        class="input input-sm input-bordered w-full max-w-xs"
        [value]="searchText()"
        (input)="onSearchInput($event)"
      />

      @if (totalPages() > 1) {
        <div class="armory-pagination">
          <button
            class="btn btn-xs"
            [disabled]="page() === 0"
            (click)="prevPage()"
          >
            «
          </button>
          <span>Page {{ page() + 1 }} / {{ totalPages() }}</span>
          <button
            class="btn btn-xs"
            [disabled]="page() >= totalPages() - 1"
            (click)="nextPage()"
          >
            »
          </button>
        </div>
      }
    </div>

    <div class="armory-grid" #gridContainer>
      @if (pagedEntries().length === 0) {
        <div class="armory-empty">No equipment found.</div>
      }

      @for (equipment of pagedEntries(); track $index) {
        <app-armory-item-slot [equipment]="equipment" />
      }
    </div>
  </div>
</app-card-page>
