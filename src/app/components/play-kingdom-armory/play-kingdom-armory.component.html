<app-paged-grid-page
  #grid
  [entries]="entries()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name or description..."
  emptyMessage="No equipment found."
>
  <span header>Armory</span>

  @for (entry of grid.pagedEntries(); track entry.item.id) {
    <app-armory-item-slot [equipment]="entry.content" [equipmentItem]="entry.item" />
  }
</app-paged-grid-page>
