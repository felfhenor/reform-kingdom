<app-page-paged-grid
  #grid
  [entries]="entries()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name or description..."
  emptyMessage="No equipment found."
  [reflow]="true"
>
  <span header class="flex items-center gap-2">
    Armory
    <span class="badge badge-sm tabular-nums {{ badgeColor() }}">
      {{ armorySize() | number }}/{{ armoryCapValue() | number }}
    </span>
  </span>

  <div toolbar-actions class="flex items-center gap-2">
    @if (sellMode()) {
      @let count = selectedCount();
      <button
        type="button"
        class="btn btn-sm btn-primary tabular-nums"
        [disabled]="count === 0"
        (click)="$event.shiftKey || sellSwal.fire()"
        (click.shift)="confirmSell()"
        appSfx="ui-success"
        [sfxTrigger]="['click', 'hover']"
      >
        Sell {{ count | number }} {{ count === 1 ? 'item' : 'items' }}
        <app-currency-cost
          [type]="goldCoinItemId"
          [amount]="selectedGoldTotal()"
        />
      </button>

      <button
        type="button"
        class="btn btn-sm btn-neutral btn-outline"
        (click)="toggleSellMode()"
        appSfx="ui-error"
        [sfxTrigger]="['click', 'hover']"
      >
        Cancel
      </button>

      <span class="type-hint">Shift-click to select multiple items.</span>

      <swal
        #sellSwal
        title="Sell items?"
        text="Are you sure you want to sell {{ selectedCount() }} items for {{
          selectedGoldTotal() | number
        }} gold?"
        icon="warning"
        (confirm)="confirmSell()"
      ></swal>
    } @else {
      <button
        type="button"
        class="btn btn-sm btn-neutral"
        (click)="toggleSellMode()"
        appSfx="ui-click"
        [sfxTrigger]="['click', 'hover']"
      >
        Enter Sell Mode
      </button>

      <button
        type="button"
        class="btn btn-sm btn-neutral"
        [class.btn-outline]="!lootFilterActive()"
        (click)="openLootFilters()"
        appSfx="ui-click"
        [sfxTrigger]="['click', 'hover']"
      >
        Auto Sell
      </button>
    }
  </div>

  @for (entry of grid.pagedEntries(); track entry.item.id) {
    <app-slot-armory-item
      [equipment]="entry.content"
      [equipmentItem]="entry.item"
      [sellMode]="sellMode()"
      [selected]="selectedIds().has(entry.item.id)"
      (toggleSelect)="toggleSelected(entry.item.id, $event)"
    />
  }
</app-page-paged-grid>

<app-modal-loot-filters />
