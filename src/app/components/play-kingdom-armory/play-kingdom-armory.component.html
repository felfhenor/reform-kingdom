<app-paged-grid-page
  #grid
  [entries]="entries()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name or description..."
  emptyMessage="No equipment found."
>
  <span header>Armory</span>

  @for (equipment of grid.pagedEntries(); track $index) {
    <app-armory-item-slot [equipment]="equipment" />
  }
</app-paged-grid-page>
