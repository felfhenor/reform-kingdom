@if (areAnyGreaterThanZero()) {
  <div
    class="bg-base-200/80 inline-flex items-center gap-2 px-2 py-1 rounded-b-lg backdrop-blur-sm opacity-50 hover:opacity-100 transition-opacity duration-200"
  >
    @for (res of resources(); track $index) {
      <div
        class="inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded tabular-nums whitespace-nowrap text-xs"
      >
        <app-currency-cost [type]="res.itemRef.id" [amount]="res.total" />
      </div>
    }
  </div>
}
