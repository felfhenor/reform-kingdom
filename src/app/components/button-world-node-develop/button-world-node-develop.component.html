@let remaining = remainingText();

<button
  type="button"
  class="btn btn-sm btn-primary tabular-nums"
  [disabled]="!canDevelop()"
  (click)="develop()"
  ffButton="ui-click"
  [ffPadAction]="padAction()"
  [ffPadLabel]="'buttonWorldNodeDevelop.develop' | t"
>
  @if (isMaxLevel()) {
    {{
      'buttonWorldNodeDevelop.thisIsFullyDeveloped' | t: { subject: subject() }
    }}
  } @else if (remaining) {
    {{
      'buttonWorldNodeDevelop.currentlyDeveloping' | t: { remaining: remaining }
    }}
  } @else {
    {{ 'buttonWorldNodeDevelop.developFor' | t }}
    <app-row-currency-cost [costs]="cost()" [showOwned]="true" />
    ({{ developTimeText() }})
  }
</button>
