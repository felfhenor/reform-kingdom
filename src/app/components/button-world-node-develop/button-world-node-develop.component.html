@let remaining = remainingText();

<button
  type="button"
  class="btn btn-sm btn-primary tabular-nums"
  [disabled]="!canDevelop()"
  (click)="develop()"
  appSfx="ui-click"
  [sfxTrigger]="['click', 'hover']"
>
  @if (isMaxLevel()) {
    This {{ subject() }} is fully developed
  } @else if (remaining) {
    Currently developing ({{ remaining }})
  } @else {
    Develop for
    <app-row-currency-cost [costs]="cost()" />
    ({{ developTimeText() }})
  }
</button>
