<app-card-page heightProfile="full">
  <span header class="flex items-center gap-2">
    Bestiary
    <span class="badge badge-sm badge-data tabular-nums">
      {{ discoveredCount() }}/{{ entries().length }}
    </span>
  </span>

  <app-button-kingdom-back pageactions />

  <div pageactionssecondary>
    <input
      type="text"
      placeholder="Search by name, drop, or location..."
      class="input input-sm input-bordered search-bar"
      [value]="searchText()"
      (input)="onSearchInput($event)"
    />
  </div>

  <!-- The layout takes its share of height via flex-1, so it doesn't fight the subtitle for h-full. -->
  <div class="flex flex-col h-full min-h-0">
    <div class="flex gap-4 min-h-0 flex-1">
      <div class="flex flex-col gap-2 w-[300px] shrink-0 min-h-0">
        <div
          class="flex-1 flex flex-col gap-2 overflow-y-auto min-h-0"
          appListReflow
        >
          @let selected = selectedEntry();

          @for (entry of filteredEntries(); track entry.monster.id) {
            <button
              appListRow
              [listRowSelected]="entry.monster.id === selected?.monster.id"
              (click)="selectMonster(entry)"
              [disabled]="!entry.discovered"
              appSfx="ui-click"
              [sfxOffset]="$index / 5"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-slot-icon-blank>
                @if (entry.discovered) {
                  <app-atlas-animation
                    spritesheet="monster"
                    [assetName]="entry.monster.sprite"
                    [frames]="entry.monster.frames"
                  />
                } @else {
                  <app-icon-unknown />
                }
              </app-slot-icon-blank>

              @if (entry.discovered) {
                <span
                  class="type-entity-name truncate text-{{
                    entry.monster.rarity
                  }}"
                >
                  {{ entry.monster.name }}
                </span>
              } @else {
                <span class="type-unknown truncate">???</span>
              }
            </button>
          } @empty {
            <app-blank-slate>No monsters found.</app-blank-slate>
          }
        </div>
      </div>

      <div class="flex-1 overflow-y-auto min-h-0">
        @if (selectedEntry(); as entry) {
          <app-detail-bestiary-monster [entry]="entry" />
        } @else {
          <app-blank-slate>No monster selected.</app-blank-slate>
        }
      </div>
    </div>
  </div>
</app-card-page>
