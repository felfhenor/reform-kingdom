<app-card-page heightProfile="full">
  <span header class="flex items-center gap-2">
    Bestiary
    <span class="badge badge-sm badge-info tabular-nums">
      {{ discoveredCount() }}/{{ entries().length }}
    </span>
  </span>

  <app-button-kingdom-back pageactions />

  <div class="bestiary-page">
    <div class="bestiary-layout">
      <div class="bestiary-list">
        <input
          type="text"
          placeholder="Search by name, drop, or location..."
          class="input input-sm input-bordered w-full"
          [value]="searchText()"
          (input)="onSearchInput($event)"
        />

        <div class="bestiary-list-scroll">
          @let selected = selectedEntry();

          @for (entry of filteredEntries(); track entry.monster.id) {
            <button
              appListRow
              [listRowSelected]="entry.monster.id === selected?.monster.id"
              (click)="selectMonster(entry.monster.id)"
              appSfx="ui-click"
              [sfxOffset]="$index"
              [sfxTrigger]="['click', 'hover']"
            >
              <app-slot-icon-blank>
                @if (entry.discovered) {
                  <app-atlas-animation
                    spritesheet="monster"
                    [assetName]="entry.monster.sprite"
                    [frames]="entry.monster.frames"
                  />
                } @else {
                  <app-icon-unknown />
                }
              </app-slot-icon-blank>

              @if (entry.discovered) {
                <span
                  class="font-semibold truncate text-{{ entry.monster.rarity }}"
                >
                  {{ entry.monster.name }}
                </span>
              } @else {
                <span class="font-semibold truncate text-lighter">???</span>
              }
            </button>
          } @empty {
            <div class="text-sm text-lighter p-2">No monsters found.</div>
          }
        </div>
      </div>

      <div class="bestiary-detail">
        @if (selectedEntry(); as entry) {
          <app-detail-bestiary-monster [entry]="entry" />
        } @else {
          <div class="text-sm text-lighter">No monster selected.</div>
        }
      </div>
    </div>
  </div>
</app-card-page>
