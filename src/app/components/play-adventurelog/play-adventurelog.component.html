<app-card-page heightProfile="full">
  <span header>{{ 'playAdventurelog.adventureLog' | t }}</span>

  <div pageactionssecondary>
    <input
      ffKeyboard
      type="text"
      [placeholder]="'playAdventurelog.searchByTagOr' | t"
      class="input input-sm input-bordered search-bar"
      [value]="searchText()"
      (input)="onSearchInput($event)"
    />
  </div>

  <div #scrollContainer class="flex flex-col gap-2 p-4 h-full overflow-y-auto">
    @for (entry of renderedEntries(); track entry.messageId) {
      <div
        class="flex gap-2 text-sm flex-wrap"
        (animate.enter)="onEnter($event, entry.messageId)"
        (animate.leave)="onLeave($event)"
      >
        <span
          class="text-lighter shrink-0 w-[150px]"
          [tp]="timestampTooltip(entry.timestamp)"
        >
          {{ entry.timestamp | timeago }}
        </span>

        <span class="text-lighter shrink-0">[{{ entry.locationName }}]</span>

        <app-adventure-log-message [entry]="entry" />
      </div>
    } @empty {
      <app-blank-slate>
        {{ 'playAdventurelog.nothingHasHappenedYet' | t }}
      </app-blank-slate>
    }

    <div #loadMoreSentinel class="shrink-0 h-px"></div>
  </div>
</app-card-page>
