<app-card-page heightProfile="full">
  <span header>Adventure Log</span>

  <div class="flex flex-col gap-2 p-4 h-full overflow-y-auto">
    @for (entry of entries(); track entry.messageId) {
      @let parts = messageParts(entry);
      <div class="flex items-center gap-2 text-sm flex-wrap">
        <span
          class="text-lighter shrink-0 w-[150px]"
          [tp]="timestampTooltip(entry.timestamp)"
        >
          {{ entry.timestamp | timeago }}
        </span>
        <span class="text-lighter shrink-0">[{{ entry.locationName }}]</span>
        @for (part of parts; track $index) {
          @if (part.kind === 'icon') {
            <span class="zoom-inline shrink-0">
              <app-slot-icon-blank [showBackground]="false">
                <app-atlas-image
                  [spritesheet]="part.spritesheet"
                  [assetName]="part.sprite"
                />
              </app-slot-icon-blank>
            </span>
          } @else {
            <span [innerHTML]="part.html"></span>
          }
        }
      </div>
    } @empty {
      <div class="p-4 italic text-lighter">Nothing has happened yet.</div>
    }
  </div>
</app-card-page>
