@let data = entry();

<app-card-status-bubble
  [expanded]="expanded()"
  [name]="data.itemName"
  [badge]="formatDurationBadge(data.remainingTicks)"
  badgeNumeric
  (click)="goToTradeskill()"
>
  <div bubbleIcon class="zoom-row">
    <app-atlas-image
      [spritesheet]="data.resultSpritesheet"
      [assetName]="data.resultSprite"
    />
  </div>
  <span bubbleSubtitle class="type-meta truncate">
    <span class="tabular-nums">
      {{ formatDuration(data.remainingTicks) }}
    </span>
    remaining
  </span>
</app-card-status-bubble>
