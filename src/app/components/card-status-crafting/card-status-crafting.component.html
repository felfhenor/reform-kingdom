@let isExpanded = expanded();
@let data = entry();

<div class="status-entry select-none" [class.expanded]="isExpanded">
  <div class="entry-icon">
    <div class="zoom-row">
      <app-atlas-image
        [spritesheet]="data.resultSpritesheet"
        [assetName]="data.resultSprite"
      />
    </div>
    @if (!isExpanded) {
      <span class="entry-timer tabular-nums">
        {{ formatDuration(data.remainingTicks) }}
      </span>
    }
  </div>

  @if (isExpanded) {
    <div class="entry-details">
      <span class="entry-subtitle text-lighter">
        <span class="tabular-nums">
          {{ formatDuration(data.remainingTicks) }}
        </span>
        remaining
      </span>
      <span class="entry-name truncate">{{ data.itemName }}</span>
    </div>
  }
</div>
