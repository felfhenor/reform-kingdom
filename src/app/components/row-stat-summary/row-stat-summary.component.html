@if (stats(); as s) {
  <app-row-item-stats
    [stats]="s"
    [bonusStats]="bonusStats()"
    [comparisonStats]="comparisonStats()"
    [layout]="layout()"
    [maxDecimals]="maxDecimals()"
    [showSign]="showSign()"
  />
}

@if (hasAnyResistances()) {
  <app-row-labeled-values
    class="text-xs"
    [dimension]="resistanceDimension"
    [values]="resistances()"
    [bonusValues]="bonusResistances()"
    [comparisonValues]="comparisonResistances()"
    [layout]="layout()"
  />
}
