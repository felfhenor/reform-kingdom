@let data = entry();

<app-card-status-bubble
  [expanded]="expanded()"
  [name]="data.name"
  [badge]="'Lv. ' + (data.level | number)"
  [dimmed]="!data.affordable"
  (click)="goToWorker()"
>
  <div bubbleIcon class="zoom-row">
    <app-atlas-animation
      spritesheet="worker"
      [assetName]="data.sprite"
      [frames]="data.frames"
    />
  </div>
  @if (data.affordable) {
    <span bubbleSubtitle class="type-meta truncate">Ready to level up</span>
  } @else {
    <span bubbleSubtitle class="type-blocker truncate">
      Need {{ data.cost | number }} gold
    </span>
  }
</app-card-status-bubble>
