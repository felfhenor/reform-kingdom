@let isExpanded = expanded();
@let data = entry();

<div
  class="status-bubble select-none cursor-pointer"
  [class.expanded]="isExpanded"
  (click)="goToWorker()"
>
  <div
    class="relative flex items-center justify-center shrink-0 overflow-hidden w-[32px] h-[32px]"
    [class.opacity-50]="!data.affordable"
  >
    <div class="zoom-row">
      <app-atlas-animation
        spritesheet="worker"
        [assetName]="data.sprite"
        [frames]="data.frames"
      />
    </div>
  </div>
  @if (!isExpanded) {
    <span class="status-bubble-badge type-meta">
      Lv. {{ data.level | number }}
    </span>
  }

  @if (isExpanded) {
    <div class="flex flex-col justify-center text-white overflow-hidden">
      @if (data.affordable) {
        <span class="type-meta truncate">Ready to level up</span>
      } @else {
        <span class="type-blocker truncate">
          Need {{ data.cost | number }} gold
        </span>
      }
      <span class="type-entity-name text-xs truncate">{{ data.name }}</span>
    </div>
  }
</div>
