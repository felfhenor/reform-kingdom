@let data = entry();

<app-card-status-bubble
  [expanded]="expanded()"
  [name]="data.name"
  [badge]="
    'cardStatusWorkerLevelup.level' | t: { level: (data.level | number) }
  "
  [dimmed]="!data.affordable"
  (click)="goToWorker()"
  tabindex="0"
>
  <div bubbleIcon class="zoom-row">
    <app-atlas-animation
      spritesheet="worker"
      [assetName]="data.sprite"
      [frames]="data.frames"
    />
  </div>
  @if (data.affordable) {
    <span bubbleSubtitle class="type-meta truncate">
      {{ 'cardStatusWorkerLevelup.readyToLevelUp' | t }}
    </span>
  } @else {
    <span bubbleSubtitle class="type-blocker truncate">
      {{
        'cardStatusWorkerLevelup.needGold' | t: { cost: (data.cost | number) }
      }}
    </span>
  }
</app-card-status-bubble>
