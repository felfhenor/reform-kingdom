<div role="tablist" class="tabs tabs-box flex-nowrap">
  @for (character of party(); track character.id) {
    @let job = jobFor(character.jobId);

    <button
      type="button"
      role="tab"
      [attr.aria-selected]="character.id === selectedId()"
      class="tab w-64 min-w-0 gap-2"
      [class.tab-active]="character.id === selectedId()"
      [class.font-bold]="character.id === selectedId()"
      (click)="selected.emit(character.id)"
      appSfx="ui-click"
      [sfxOffset]="$index"
      [sfxTrigger]="['click', 'hover']"
    >
      <div class="hero-tab-icon">
        <app-icon-job [job]="job" />
        <app-badge-skill-points [character]="character" dot />
      </div>
      <span class="truncate min-w-0 flex-1 text-left" [tp]="character.name">
        {{ character.name }}
      </span>
      <app-label-job
        class="text-lighter shrink-0 tabular-nums"
        [character]="character"
      />
    </button>
  }
</div>
