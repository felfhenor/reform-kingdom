<div role="tablist" class="tabs tabs-box">
  @for (character of party(); track character.id) {
    @let job = jobFor(character.jobId);

    <button
      type="button"
      role="tab"
      class="tab gap-2"
      [class.tab-active]="character.id === selectedId()"
      [class.font-bold]="character.id === selectedId()"
      (click)="selected.emit(character.id)"
      appSfx="ui-click"
      [sfxOffset]="$index"
      [sfxTrigger]="['click', 'hover']"
    >
      <div class="hero-tab-icon">
        <app-icon-job [job]="job" />
      </div>
      {{ character.name }}
      <app-label-job class="text-lighter" [character]="character" />

      <app-badge-skill-points [character]="character" />
    </button>
  }
</div>
