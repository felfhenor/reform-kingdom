@for (bonus of bonuses(); track $index) {
  <div class="text-xs my-2 flex items-center gap-2">
    <span class="zoom-inline">
      <app-slot-icon-blank [showBackground]="false">
        <app-atlas-image spritesheet="skill" [assetName]="bonus.skillSprite" />
      </app-slot-icon-blank>
    </span>

    <span class="ml-[4px]">
      {{ bonus.skillName }}
      {{ (bonus.value > 0 ? '+' : '') + (bonus.value * 100 | number) }}%
      {{ statShorthand[bonus.stat] }}
    </span>
  </div>
}
