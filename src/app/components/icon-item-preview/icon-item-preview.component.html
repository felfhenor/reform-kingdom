@if (backdropSprite(); as backdrop) {
  <div class="relative w-full h-full {{ cssClass() }}">
    <app-atlas-image
      spritesheet="item"
      [assetName]="backdrop"
      class="absolute z-0"
    />
    <app-atlas-image
      [spritesheet]="spritesheet()"
      [assetName]="sprite()"
      class="absolute z-10"
    />
  </div>
} @else {
  <app-atlas-image
    [spritesheet]="spritesheet()"
    [assetName]="sprite()"
    [cssClass]="cssClass()"
  />
}
