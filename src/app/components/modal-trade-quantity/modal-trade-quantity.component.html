<swal
  #confirmSwal
  icon="question"
  [confirmButtonText]="'modalTradeQuantity.yes' | t"
  [cancelButtonText]="'modalTradeQuantity.cancel' | t"
></swal>

<swal
  #quantitySwal
  icon="question"
  input="number"
  [confirmButtonText]="'modalTradeQuantity.confirm' | t"
  [cancelButtonText]="'modalTradeQuantity.cancel' | t"
  [customClass]="{
    confirmButton: 'btn btn-primary',
    denyButton: 'btn btn-primary btn-outline',
    cancelButton: 'btn btn-neutral btn-outline',
  }"
></swal>
