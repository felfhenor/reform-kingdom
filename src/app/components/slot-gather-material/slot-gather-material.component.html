@if (isDiscovered() && item(); as material) {
  <app-tooltip-item-preview #preview [display]="display()" />

  <div [tp]="preview.template()" [tpPlacement]="'top'">
    <app-slot-rarity-outline
      spritesheet="item"
      [entry]="material"
    ></app-slot-rarity-outline>
  </div>
} @else {
  <div [tp]="'A material yet to be discovered.'" [tpPlacement]="'top'">
    <app-icon-unknown />
  </div>
}
