<ng-template #tooltipContent>
  @if (display(); as item) {
    <app-detail-item-preview
      [display]="item"
      [bonusStats]="bonusStats()"
      [bonusResistances]="bonusResistances()"
      [bonusCombatStats]="bonusCombatStats()"
      [showEquippableBy]="showEquippableBy()"
      [showDescription]="showDescription()"
    >
      <ng-content></ng-content>
    </app-detail-item-preview>

    <ng-content select="[preview-footer]"></ng-content>
  }
</ng-template>
