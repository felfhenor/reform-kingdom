@let tab = activeTab();

<app-paged-grid-page
  #grid
  [entries]="entries()"
  [filterFn]="filterFn"
  searchPlaceholder="Search by name, description, or location..."
  emptyMessage="No collectibles found."
  [showToolbar]="tab === 'collectibles'"
  [showGrid]="tab === 'collectibles'"
>
  <span header>Museum</span>

  <div before-toolbar role="tablist" class="tabs tabs-boxed">
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab-active]="tab === 'collectibles'"
      (click)="setTab('collectibles')"
    >
      Collectibles ({{ discoveredCount() }}/{{ entries().length }})
    </button>
    <button
      type="button"
      role="tab"
      class="tab"
      [class.tab-active]="tab === 'recipes'"
      (click)="setTab('recipes')"
    >
      Recipes
    </button>
  </div>

  @if (tab === 'collectibles') {
    @for (entry of grid.pagedEntries(); track entry.collectible.id) {
      <app-museum-collectible-slot [entry]="entry" />
    }
  } @else {
    <div custom class="museum-empty">Recipes coming soon.</div>
  }
</app-paged-grid-page>
