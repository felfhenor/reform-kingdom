@let tab = activeTab();

@if (tab === 'collectibles') {
  <app-paged-grid-page
    #collectiblesGrid
    [entries]="collectibleEntries()"
    [filterFn]="collectibleFilterFn"
    searchPlaceholder="Search by name, description, or location..."
    emptyMessage="No collectibles found."
  >
    <span header>Museum</span>

    <div before-toolbar role="tablist" class="tabs tabs-boxed">
      <button
        type="button"
        role="tab"
        class="tab tab-active"
        (click)="setTab('collectibles')"
      >
        Collectibles ({{ collectibleDiscoveredCount() }}/{{
          collectibleEntries().length
        }})
      </button>
      <button
        type="button"
        role="tab"
        class="tab"
        (click)="setTab('recipes')"
      >
        Recipes ({{ recipeDiscoveredCount() }}/{{ recipeEntries().length }})
      </button>
    </div>

    @for (entry of collectiblesGrid.pagedEntries(); track entry.collectible.id) {
      <app-museum-collectible-slot [entry]="entry" />
    }
  </app-paged-grid-page>
} @else {
  <app-paged-grid-page
    #recipesGrid
    [entries]="recipeEntries()"
    [filterFn]="recipeFilterFn"
    searchPlaceholder="Search by name or location..."
    emptyMessage="No recipes found."
  >
    <span header>Museum</span>

    <div before-toolbar role="tablist" class="tabs tabs-boxed">
      <button
        type="button"
        role="tab"
        class="tab"
        (click)="setTab('collectibles')"
      >
        Collectibles ({{ collectibleDiscoveredCount() }}/{{
          collectibleEntries().length
        }})
      </button>
      <button
        type="button"
        role="tab"
        class="tab tab-active"
        (click)="setTab('recipes')"
      >
        Recipes ({{ recipeDiscoveredCount() }}/{{ recipeEntries().length }})
      </button>
    </div>

    @for (entry of recipesGrid.pagedEntries(); track entry.recipe.id) {
      <app-museum-recipe-slot [entry]="entry" />
    }
  </app-paged-grid-page>
}
