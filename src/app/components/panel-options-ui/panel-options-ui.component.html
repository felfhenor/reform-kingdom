<div class="flex flex-row gap-4">
  <div class="flex-1 flex flex-col gap-4">
    <div class="card shadow-sm">
      <div class="card-body p-3 gap-2">
        <div class="type-section-title">Gameplay</div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('runInBackground')"
              class="checkbox"
              (click)="
                setOption('runInBackground', !getOption('runInBackground'))
              "
            />
            <span class="label-text">Run in Background</span>
            <app-icon
              name="gameHelp"
              size="inline"
              class="text-lighter ml-1"
              [tp]="'Keeps the game running while it is minimized or in another tab.'"
              [tpPlacement]="'top'"
            />
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('showBackdropGrid')"
              class="checkbox"
              (click)="
                setOption('showBackdropGrid', !getOption('showBackdropGrid'))
              "
            />
            <span class="label-text">Backdrop Grid</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('partyViewAlwaysExpand')"
              class="checkbox"
              (click)="
                setOption(
                  'partyViewAlwaysExpand',
                  !getOption('partyViewAlwaysExpand')
                )
              "
            />
            <span class="label-text">Always Expand Party View</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('craftingViewAlwaysExpand')"
              class="checkbox"
              (click)="
                setOption(
                  'craftingViewAlwaysExpand',
                  !getOption('craftingViewAlwaysExpand')
                )
              "
            />
            <span class="label-text">Always Expand Crafting View</span>
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('adventureLogOverlay')"
              class="checkbox"
              (click)="
                setOption(
                  'adventureLogOverlay',
                  !getOption('adventureLogOverlay')
                )
              "
            />
            <span class="label-text">Adventure Log Overlay</span>
          </label>
        </div>

        @if (getOption('adventureLogOverlay')) {
          <div class="flex flex-col gap-1 pl-6">
            @for (kind of adventureLogKinds; track kind) {
              <div class="form-control">
                <label class="label cursor-pointer label-checkbox">
                  <input
                    type="checkbox"
                    [checked]="getOption('adventureLogOverlayKinds')[kind]"
                    class="checkbox checkbox-sm"
                    (click)="toggleAdventureLogOverlayKind(kind)"
                  />
                  <span class="label-text">Show {{ kind }} Messages</span>
                </label>
              </div>
            }
          </div>
        }
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-3 gap-2">
        <div class="type-section-title">Performance</div>

        <div class="form-control">
          <label class="label label-checkbox gap-2">
            <span class="label-text !ml-0 mr-2 min-w-[100px]">
              Map Frame Rate
            </span>
            <ng-select
              class="w-32"
              [items]="mapFrameRateChoices"
              bindLabel="label"
              bindValue="value"
              [clearable]="false"
              [searchable]="false"
              [(ngModel)]="mapFrameRate"
              (ngModelChange)="setOption('mapFrameRate', $event)"
            ></ng-select>
            <app-icon
              name="gameHelp"
              size="inline"
              class="text-lighter"
              [tp]="'How often the world map redraws. Lower values use less power. Does not affect game speed.'"
              [tpPlacement]="'top'"
            />
          </label>
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-checkbox">
            <input
              type="checkbox"
              [checked]="getOption('lowerFrameRateWhenUnfocused')"
              class="checkbox"
              (click)="
                setOption(
                  'lowerFrameRateWhenUnfocused',
                  !getOption('lowerFrameRateWhenUnfocused')
                )
              "
            />
            <span class="label-text">Lower Frame Rate When Unfocused</span>
            <app-icon
              name="gameHelp"
              size="inline"
              class="text-lighter ml-1"
              [tp]="'Drops the world map to 10 FPS while the game window is not focused, such as when it is on another monitor.'"
              [tpPlacement]="'top'"
            />
          </label>
        </div>
      </div>
    </div>

    <div class="flex-1 flex flex-col gap-4">
      <div class="card shadow-sm">
        <div class="card-body p-3 gap-2">
          <div class="type-section-title">Audio</div>

          <div class="form-control">
            <label class="label cursor-pointer label-checkbox">
              <input
                type="checkbox"
                [checked]="getOption('muteWhenUnfocused')"
                class="checkbox"
                (click)="
                  setOption(
                    'muteWhenUnfocused',
                    !getOption('muteWhenUnfocused')
                  )
                "
              />
              <span class="label-text">Mute When Unfocused</span>
            </label>
          </div>

          <div class="form-control">
            <label class="label cursor-pointer label-checkbox">
              <input
                type="checkbox"
                [checked]="getOption('bgmPlay')"
                class="checkbox"
                (click)="setOption('bgmPlay', !getOption('bgmPlay'))"
              />
              <span class="label-text">Play Background Music</span>
            </label>
          </div>

          @if (getOption('bgmPlay')) {
            <div class="form-control">
              <label class="label cursor-pointer label-checkbox">
                <span class="label-text !ml-0 mr-2">
                  Background Music Volume
                </span>
                <input
                  #bgmVolume
                  type="range"
                  [min]="0"
                  [max]="1"
                  [step]="0.05"
                  [value]="getOption('bgmVolume')"
                  (change)="setOption('bgmVolume', bgmVolume.valueAsNumber)"
                  class="range"
                />
                <span class="ml-2">
                  {{ getOption('bgmVolume') * 100 | number: '1.0-0' }}%
                </span>
              </label>
            </div>
          }

          <div class="form-control">
            <label class="label cursor-pointer label-checkbox">
              <input
                type="checkbox"
                [checked]="getOption('sfxPlay')"
                class="checkbox"
                (click)="setOption('sfxPlay', !getOption('sfxPlay'))"
              />
              <span class="label-text">Play Sound Effects</span>
            </label>
          </div>

          @if (getOption('sfxPlay')) {
            <div class="form-control">
              <label class="label cursor-pointer label-checkbox">
                <span class="label-text !ml-0 mr-2">Sound Effects Volume</span>
                <input
                  #sfxVolume
                  type="range"
                  [min]="0"
                  [max]="1"
                  [step]="0.05"
                  [value]="getOption('sfxVolume')"
                  (change)="setOption('sfxVolume', sfxVolume.valueAsNumber)"
                  class="range"
                />
                <span class="ml-2">
                  {{ getOption('sfxVolume') * 100 | number: '1.0-0' }}%
                </span>
              </label>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
