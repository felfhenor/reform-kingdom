@let finished = isFinished();
@let lost = isLost();

@if (compact()) {
  <button
    type="button"
    class="btn btn-sm btn-neutral"
    appButtonGlow
    [tp]="'buttonRunEnd.finishThisRun' | t"
    [disabled]="isBusy()"
    [swal]="endSwal"
    appSfx="ui-success"
    [sfxTrigger]="['click', 'hover']"
  >
    <app-icon name="gameTrophyCup" size="nav"></app-icon>
  </button>
} @else if (lost) {
  <!-- A lost run has nothing left to play, so there's nothing to confirm. -->
  <button
    type="button"
    class="btn btn-error"
    [class.btn-block]="block()"
    [disabled]="isBusy()"
    (click)="endRun()"
    appSfx="ui-error"
    [sfxTrigger]="['click', 'hover']"
  >
    {{ 'buttonRunEnd.endRun' | t }}
  </button>
} @else {
  <button
    type="button"
    class="btn"
    [class.btn-block]="block()"
    [class.btn-primary]="finished"
    [class.btn-error]="!finished"
    [class.btn-outline]="!finished"
    [disabled]="isBusy()"
    [swal]="endSwal"
    [appSfx]="finished ? 'ui-success' : 'ui-error'"
    [sfxTrigger]="['click', 'hover']"
  >
    {{
      finished
        ? ('buttonRunEnd.finishRun' | t)
        : ('buttonRunEnd.abandonRun' | t)
    }}
  </button>
}

<swal
  #endSwal
  [title]="
    finished
      ? ('buttonRunEnd.finishThisRun2' | t)
      : ('buttonRunEnd.abandonThisRun' | t)
  "
  [text]="
    finished
      ? ('buttonRunEnd.thisRunIsAdded' | t)
      : ('buttonRunEnd.thisRunIsAdded2' | t)
  "
  [icon]="finished ? 'question' : 'warning'"
  [confirmButtonText]="
    finished
      ? ('buttonRunEnd.yesFinishRun' | t)
      : ('buttonRunEnd.yesAbandonRun' | t)
  "
  [cancelButtonText]="'buttonRunEnd.noKeepPlaying' | t"
  (confirm)="endRun()"
></swal>
