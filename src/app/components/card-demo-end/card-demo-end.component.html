<div #backdrop class="absolute inset-0 bg-black/60"></div>

<div class="relative flex h-full items-center justify-center p-4">
  <div #card class="card bg-base-100 shadow-xl page-card w-full max-w-xl">
    <div class="card-body">
      <h2 class="type-page-title justify-center">
        {{ 'cardDemoEnd.theEdgeOfMemory' | t }}
      </h2>
      <p class="type-flavor text-center">
        {{ 'cardDemoEnd.youHaveReachedThe' | t }}
      </p>

      <div class="my-2 flex flex-col gap-4">
        <p>
          {{ 'cardDemoEnd.carrinaAndTheCraggled' | t }}
        </p>

        <p>
          {{ 'cardDemoEnd.theRestOfThe' | t }}
        </p>

        <p>
          {{ 'cardDemoEnd.youCanKeepPlaying' | t }}
        </p>

        <p>{{ 'cardDemoEnd.thankYouForPlaying' | t }}</p>
      </div>

      <div class="card-actions justify-end">
        <button
          #continueButton
          type="button"
          class="btn btn-neutral"
          (click)="dismiss()"
          appSfx="ui-click"
          [sfxTrigger]="['click', 'hover']"
        >
          {{ 'cardDemoEnd.keepPlaying' | t }}
        </button>

        <app-button-wishlist [small]="false" />
      </div>
    </div>
  </div>
</div>
