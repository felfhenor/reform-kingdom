<div class="flex flex-col gap-2">
  <app-button-world-node-develop [entry]="entry()" subject="shrine" />

  <button
    type="button"
    class="btn btn-sm btn-secondary"
    [disabled]="!canPray()"
    (click)="doPray()"
    appSfx="ui-success"
    [sfxTrigger]="['click', 'hover']"
  >
    @if (currentBuffName(); as buffName) {
      Pray for {{ buffName }}
    } @else {
      Develop to pray here
    }
  </button>
</div>
