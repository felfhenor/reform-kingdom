<div class="flex flex-col gap-2">
  <button
    type="button"
    class="btn btn-sm btn-primary"
    [disabled]="!canDevelop()"
    (click)="develop.emit()"
    appSfx="ui-click"
    [sfxTrigger]="['click', 'hover']"
  >
    @if (isMaxLevel()) {
      This shrine is fully developed
    } @else {
      Develop for
      <app-row-currency-cost [costs]="cost()" />
    }
  </button>

  <button
    type="button"
    class="btn btn-sm btn-secondary"
    [disabled]="!canPray()"
    (click)="doPray()"
    appSfx="ui-success"
    [sfxTrigger]="['click', 'hover']"
  >
    @if (currentBuffName(); as buffName) {
      Pray for {{ buffName }}
    } @else {
      Develop to pray here
    }
  </button>
</div>
