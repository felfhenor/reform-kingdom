<div class="flex flex-col gap-2">
  <app-button-world-node-develop
    [entry]="entry()"
    subject="shrine"
    padAction="details"
  />

  @let buff = currentBuff();
  @if (buff) {
    <app-tooltip-global-effect #buffTooltip [effect]="buff" />

    <!-- Tooltip sits on a wrapper: a disabled button fires no hover events. -->
    <span class="flex flex-col" [tp]="buffTooltip.template()">
      <button
        type="button"
        class="btn btn-sm btn-neutral"
        [disabled]="!canPray()"
        (click)="doPray()"
        ffButton="ui-success"
        ffPadAction="context"
        [ffPadLabel]="'panelMapNodeActionsShrine.pray' | t"
      >
        {{ 'panelMapNodeActionsShrine.prayFor' | t }}
        <app-atlas-image
          class="zoom-inline"
          spritesheet="globaleffect"
          [assetName]="buff.sprite"
        />
        {{ buff | contentName }}
        @if (cooldownLabel(); as label) {
          ({{ label }})
        }
      </button>
    </span>
  } @else {
    <button type="button" class="btn btn-sm btn-neutral" [disabled]="true">
      {{ 'panelMapNodeActionsShrine.developToPrayHere' | t }}
    </button>
  }
</div>
