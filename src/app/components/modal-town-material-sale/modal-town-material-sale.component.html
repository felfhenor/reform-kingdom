<app-modal
  modalId="town-materials"
  [showCloseButton]="true"
  [allowEscToClose]="true"
  [closeOnBackdropClick]="true"
>
  <span title>
    {{
      'modalTownMaterialSale.materialSales'
        | t: { town: (town() | contentName) || 'Town' }
    }}
  </span>

  <div body class="flex flex-col gap-2 max-h-[400px] overflow-y-auto pr-2">
    @for (row of rows(); track row.index) {
      <app-slot-caravan-trade
        [row]="row"
        merchantLabel="town"
        (activate)="requestTrade(row, $event)"
      />
    } @empty {
      <app-blank-slate>
        {{ 'modalTownMaterialSale.thisTownHasNothing' | t }}
      </app-blank-slate>
    }
  </div>
</app-modal>

<app-modal-trade-quantity />
