<div class="navbar bg-base-100 relative flex py-0">
  <div class="navbar-start flex-1">
    <ul class="menu menu-horizontal py-0 px-1">
      <li class="flex gap-2 flex-row" appRequireSetup>
        <button
          class="btn btn-xs btn-info"
          [class.btn-outline]="activeGamePlayView() !== 'kingdom'"
          tp="Kingdom [1]"
          (click)="changeGamePlayView('kingdom')"
          appSfx="ui-click"
          [sfxOffset]="1"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'1'"
          (hotkey)="hotkeyMatches($event, '1') && changeGamePlayView('kingdom')"
          isGlobal
        >
          Kingdom
        </button>

        <button
          class="btn btn-xs btn-info"
          [class.btn-outline]="activeGamePlayView() !== 'world'"
          tp="World [2]"
          (click)="changeGamePlayView('world')"
          appSfx="ui-click"
          [sfxOffset]="0"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'2'"
          (hotkey)="hotkeyMatches($event, '2') && changeGamePlayView('world')"
          isGlobal
        >
          World
        </button>

        <button
          class="btn btn-xs btn-info"
          [class.btn-outline]="activeGamePlayView() !== 'heroes'"
          tp="Heroes [3]"
          (click)="changeGamePlayView('heroes')"
          appSfx="ui-click"
          [sfxOffset]="3"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'3'"
          (hotkey)="hotkeyMatches($event, '3') && changeGamePlayView('heroes')"
          isGlobal
        >
          Heroes
        </button>

        <button
          class="btn btn-xs btn-info"
          [class.btn-outline]="activeGamePlayView() !== 'adventurelog'"
          tp="Adventure Log [4]"
          (click)="changeGamePlayView('adventurelog')"
          appSfx="ui-click"
          [sfxOffset]="2"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'4'"
          (hotkey)="hotkeyMatches($event, '4') && changeGamePlayView('adventurelog')"
          isGlobal
        >
          Adventure Log
        </button>

        <button
          class="btn btn-xs btn-info"
          [class.btn-outline]="activeGamePlayView() !== 'decree'"
          tp="Decree [5]"
          (click)="changeGamePlayView('decree')"
          appSfx="ui-click"
          [sfxOffset]="4"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'5'"
          (hotkey)="hotkeyMatches($event, '5') && changeGamePlayView('decree')"
          isGlobal
        >
          Decree
        </button>
      </li>
    </ul>
  </div>

  <app-button-update class="mx-1"></app-button-update>

  <div class="navbar-end">
    <ul class="menu menu-horizontal px-1 flex gap-2">
      @for (panel of panelConfigs; track $index) {
        <li class="action-button" appRequireSetup>
          <button
            class="btn btn-xs btn-secondary"
            [tp]="panel.name + ' [' + panel.hotkey + ']'"
            (click)="panel.clickCb()"
            [hotkeys]="panel.hotkey"
            (hotkey)="hotkeyMatches($event, panel.hotkey) && panel.clickCb()"
            isGlobal
            appSfx="ui-click"
            [sfxOffset]="$index"
            [sfxTrigger]="['click', 'hover']"
          >
            <app-icon [name]="panel.icon" size="2em" color="#000"></app-icon>
          </button>
        </li>
      }

      @if (showCaravanTradeButton()) {
        <li class="action-button" appRequireSetup>
          <button
            class="btn btn-xs btn-warning"
            appButtonGlow
            tp="Trade with the Caravan [T]"
            (click)="openCaravanTrade()"
            appSfx="ui-click"
            [sfxTrigger]="['click', 'hover']"
            [hotkeys]="'t'"
            [hotkeysOptions]="noPreventDefault"
            (hotkey)="hotkeyMatches($event, 't') && openCaravanTrade()"
            isGlobal
          >
            <app-icon name="gameSwapBag" size="2em" color="#000"></app-icon>
          </button>
        </li>
      }

      @if (showRecenterButton()) {
        <li class="action-button" appRequireSetup>
          <button
            class="btn btn-xs btn-secondary"
            tp="Recenter on Hero [R]"
            (click)="recenterCamera()"
            appSfx="ui-click"
            [sfxOffset]="panelConfigs.length + 3"
            [sfxTrigger]="['click', 'hover']"
            [hotkeys]="'r'"
            [hotkeysOptions]="noPreventDefault"
            (hotkey)="hotkeyMatches($event, 'r') && recenterCamera()"
            isGlobal
          >
            <app-icon name="tablerFocus" size="2em" color="#000"></app-icon>
          </button>
        </li>
      }

      <li class="action-button" appRequireSetup>
        <button
          class="btn btn-xs btn-info"
          [tp]="isPaused() ? 'Resume Game [SPACE]' : 'Pause Game [SPACE]'"
          (click)="togglePause()"
          appSfx="ui-click"
          [sfxOffset]="panelConfigs.length + 2"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'SPACE'"
          (hotkey)="hotkeyMatches($event, 'SPACE') && togglePause()"
          isGlobal
        >
          <app-icon
            [name]="isPaused() ? 'gamePlayButton' : 'gamePauseButton'"
            size="2em"
            color="#000"
          ></app-icon>
        </button>
      </li>

      <li class="action-button" appRequireNotSetup>
        <a
          class="btn btn-xs btn-warning"
          [swal]="leaveSwal"
          [tp]="'Go Back [Q]'"
          appSfx="ui-error"
          [sfxOffset]="panelConfigs.length + 1"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'q'"
          (hotkey)="hotkeyMatches($event, 'q') && leaveSwal.fire()"
          isGlobal
        >
          <app-icon name="gameExitDoor" size="2em" color="#000"></app-icon>
        </a>
      </li>

      <li class="action-button" appRequireSetup>
        <button
          class="btn btn-xs btn-accent"
          [tp]="'Open Menu [ESC]'"
          (click)="closeAllMenus()"
          appSfx="ui-click"
          [sfxOffset]="panelConfigs.length + 2"
          [sfxTrigger]="['click', 'hover']"
          [hotkeys]="'ESCAPE'"
          (hotkey)="hotkeyMatches($event, 'ESCAPE') && closeAllMenus()"
          isGlobal
        >
          <app-icon
            [name]="'tablerSettings'"
            size="2em"
            color="#000"
          ></app-icon>
        </button>
      </li>
    </ul>
  </div>
</div>

<div class="resource-bar-wrapper">
  <app-bar-resource />
</div>

<swal
  #leaveSwal
  title="Go back to main menu?"
  icon="question"
  confirmButtonText="Yes, go back"
  cancelButtonText="No, stay here"
  (confirm)="goToHome()"
></swal>

<app-modal
  modalId="pause-menu"
  [widthClass]="'max-w-[300px]'"
  [closeOnBackdropClick]="true"
  (modalClose)="closePauseMenu()"
>
  <span title>Game Paused</span>

  <div body class="flex flex-col gap-2">
    <div class="py-2 mb-4 italic text-center">
      The game is currently paused.
    </div>

    <a
      class="btn btn-info"
      (click)="closePauseMenu()"
      appSfx="ui-click"
      [sfxOffset]="0"
      [sfxTrigger]="['click', 'hover']"
    >
      Resume
    </a>

    <app-button-content-analysis></app-button-content-analysis>

    <app-button-settings></app-button-settings>

    <a
      class="btn btn-warning"
      [swal]="leaveSwal"
      appSfx="ui-error"
      [sfxOffset]="2"
      [sfxTrigger]="['click', 'hover']"
    >
      Quit to Main Menu
    </a>

    <app-button-quit></app-button-quit>
  </div>
</app-modal>

<app-modal-caravan-trade></app-modal-caravan-trade>
