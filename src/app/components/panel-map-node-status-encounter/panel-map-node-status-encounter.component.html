@if (progress(); as progressValue) {
  <div class="card bg-base-100 shadow-xl pointer-events-auto">
    <div class="card-body gap-2 p-3">
      <div class="text-xs text-lighter">
        Fighting monsters... Encounter {{ progressValue.current | number }}/{{
          progressValue.total | number
        }}
      </div>
      <progress
        class="progress progress-primary w-full"
        [value]="progressPercent()"
        max="100"
      ></progress>
    </div>
  </div>
}
