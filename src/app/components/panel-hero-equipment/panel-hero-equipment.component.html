@let char = character();

<div class="hero-equipment-panel flex flex-col gap-4 h-full min-h-0">
  <div class="hero-summary flex items-center justify-center gap-4 shrink-0">
    <div [appHideUntilLevel]="3" class="flex flex-col gap-2">
      <app-slot-button-container
        [disabled]="!isAtKingdomCurrently()"
        [helpText]="'This must be done at the Duchy.'"
      >
        <button
          class="btn btn-accent btn-sm w-full"
          [disabled]="!isAtKingdomCurrently() || !canPromote()"
          (click)="promote()"
          appSfx="ui-click"
          [sfxTrigger]="['click', 'hover']"
        >
          Promote
        </button>
      </app-slot-button-container>

      <app-slot-button-container
        [disabled]="!isAtKingdomCurrently()"
        [helpText]="'This must be done at the Duchy.'"
      >
        <button
          class="btn btn-accent btn-sm w-full"
          [disabled]="!isAtKingdomCurrently() || !canDemote()"
          (click)="demote()"
          appSfx="ui-click"
          [sfxTrigger]="['click', 'hover']"
        >
          Demote
        </button>
      </app-slot-button-container>
    </div>

    <div class="hero-summary-icon">
      <app-slot-icon-blank>
        <app-icon-job [job]="job()" />
      </app-slot-icon-blank>
    </div>

    <div class="flex flex-col items-start gap-2 min-w-[400px]">
      <div class="font-semibold text-lg">
        {{ char.name }}
        <span class="text-sm text-lighter font-normal">
          Lv. {{ char.level }} {{ job()?.name }} ({{ job()?.shorthand }})
        </span>
      </div>

      <app-bar-progress
        class="w-56"
        color="primary"
        [value]="char.xp.current"
        [max]="char.xp.maximum"
      >
        {{ char.xp.current | number }}/{{ char.xp.maximum | number }}
      </app-bar-progress>
    </div>

    <div class="flex flex-col gap-2">
      <app-button-hero-combat-orders
        class="w-full"
        [characterId]="char.id"
        [appHideUntilLevel]="3"
      />

      @if (teachingsUnlocked()) {
        <app-button-hero-teachings class="w-full" [characterId]="char.id" />
      }
    </div>
  </div>

  <app-modal-hero-combat-orders />
  <app-modal-hero-teachings />

  <div
    class="grid grid-cols-[300px_160px_minmax(0,1fr)_300px] gap-4 flex-1 min-h-0"
  >
    <app-panel-hero-equipment-stats [character]="char" />
    <app-panel-hero-equipment-equipment [character]="char" />
    <app-panel-hero-equipment-skills [character]="char" />
  </div>
</div>
