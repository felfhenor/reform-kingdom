@let rows = entries();

@if (rows.length > 0) {
  <button
    type="button"
    class="task-list-header"
    (click)="openTasks()"
    appSfx="ui-click"
    [sfxTrigger]="['click', 'hover']"
  >
    <span class="type-label flex gap-2 items-center">
      <app-icon name="tablerList"></app-icon>

      Tasks
    </span>
  </button>

  @for (row of rows; track row.taskId; let i = $index) {
    <app-row-task-status
      [row]="row"
      [tp]="row.name + ': ' + row.description"
      [tpPlacement]="'left'"
      (animate.enter)="onRowEnter($event, i)"
      (animate.leave)="onRowLeave($event)"
    />
  }
}
