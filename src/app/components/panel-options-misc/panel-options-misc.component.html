<div class="flex flex-row gap-4">
  <div class="flex-1 flex flex-col gap-4">
    <div class="card shadow-sm">
      <div class="card-body p-3 gap-2">
        <div class="type-section-title">
          {{ 'panelOptionsMisc.miscellaneous' | t }}
        </div>

        <div class="form-control">
          <label class="label cursor-pointer label-option">
            <span class="label-text">
              {{ 'panelOptionsMisc.analytics' | t }}
              <app-icon
                name="gameHelp"
                size="inline"
                class="text-lighter"
                [tp]="'panelOptionsMisc.analyticsAreNotTied' | t"
                [tpPlacement]="'top'"
              />
            </span>
            <input
              type="checkbox"
              [checked]="getOption('analyticsEnabled')"
              [disabled]="!canAnalyticsActivate()"
              class="checkbox"
              (click)="
                setOption('analyticsEnabled', !getOption('analyticsEnabled'))
              "
            />
          </label>
        </div>

        @if (!isDemo) {
          <div class="form-control">
            <label class="label cursor-pointer label-option">
              <span class="label-text">
                {{ 'panelOptionsMisc.showMapCoordinates' | t }}
                <app-icon
                  name="gameHelp"
                  size="inline"
                  class="text-lighter"
                  [tp]="'panelOptionsMisc.hoveringTheWorldMap' | t"
                  [tpPlacement]="'top'"
                />
              </span>
              <input
                type="checkbox"
                [checked]="getOption('showMapCoordinates')"
                class="checkbox"
                (click)="
                  setOption(
                    'showMapCoordinates',
                    !getOption('showMapCoordinates')
                  )
                "
              />
            </label>
          </div>
        }
      </div>
    </div>
  </div>
</div>
