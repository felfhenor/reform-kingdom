@let item = entry().item;

<app-tooltip-item-preview #preview [display]="display()">
  <div class="type-hint mt-2">Quantity: {{ entry().quantity | number }}</div>
</app-tooltip-item-preview>

<div class="storage-item-slot" [tp]="preview.template()" [tpPlacement]="'top'">
  <app-slot-rarity-outline [entry]="item" spritesheet="item">
    <span text-br>{{ displayQuantity() }}</span>
  </app-slot-rarity-outline>

  @if (isInfusable()) {
    <app-badge-infusable />
  }
</div>
