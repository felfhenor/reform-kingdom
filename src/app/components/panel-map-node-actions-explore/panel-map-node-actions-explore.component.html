@if (isExploreRandomCleared()) {
  <button type="button" class="btn btn-sm btn-primary" [disabled]="true">
    Explore Again
  </button>
} @else {
  <button
    type="button"
    class="btn btn-sm btn-primary"
    (click)="reExplore.emit()"
    appSfx="ui-click"
    [sfxTrigger]="['click', 'hover']"
    [disabled]="!canReExplore()"
  >
    Explore Again
  </button>
}
