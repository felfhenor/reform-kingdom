@if (isExploreRandomCleared()) {
  <button type="button" class="btn btn-sm btn-primary" [disabled]="true">
    {{ 'panelMapNodeActionsExplore.exploreAgain' | t }}
  </button>
} @else {
  <button
    type="button"
    class="btn btn-sm btn-primary"
    (click)="reExplore.emit()"
    ffButton="ui-click"
    ffPadAction="context"
    [ffPadLabel]="'panelMapNodeActionsExplore.exploreAgain' | t"
    [disabled]="!canReExplore() || isInCombat()"
  >
    {{ 'panelMapNodeActionsExplore.exploreAgain' | t }}
  </button>
}
