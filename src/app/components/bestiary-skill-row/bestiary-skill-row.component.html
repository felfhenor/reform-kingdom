@let s = skill();

<div class="flex items-center gap-1" [tp]="skillTooltip" [tpPlacement]="'left'">
  <div class="zoom-row shrink-0">
    <app-icon-blank-slot>
      <app-atlas-image spritesheet="skill" [assetName]="s.sprite" />
    </app-icon-blank-slot>
  </div>
  <span class="text-xs truncate text-{{ s.rarity }}">{{ s.name }}</span>
</div>

<ng-template #skillTooltip>
  <div class="p-2 max-w-xs">
    <div class="font-bold mb-1 text-{{ s.rarity }}">{{ s.name }}</div>
    <div class="text-sm">{{ description() }}</div>
  </div>
</ng-template>
