<button
  class="btn btn-neutral btn-block"
  appDisableOutsideElectron
  [swal]="quitSwal"
  appAnalyticsClick="Meta:Quit"
  appSfx="ui-error"
  [sfxTrigger]="['hover', 'click']"
>
  {{ 'buttonQuit.quit' | t }}
</button>

<swal
  #quitSwal
  [title]="'buttonQuit.quitReFormKingdom' | t"
  [text]="'buttonQuit.booWillMissYou' | t"
  icon="warning"
  [confirmButtonText]="'buttonQuit.yesQuitGame' | t"
  [cancelButtonText]="'buttonQuit.noCancel' | t"
  (confirm)="meta.quit()"
></swal>
