<div
  class="flex gap-2"
  [class.flex-col]="layout() === 'column'"
  [class.flex-row]="layout() === 'row'"
  [class.flex-wrap]="layout() === 'row'"
  [class.gap-x-3]="layout() === 'row'"
>
  @for (key of baseRows(); track key) {
    <div class="flex items-center gap-1">
      <app-icon [name]="icon(key)" size="stat" />
      <span>
        {{ label(key) }}: {{ baseValue(key) | statDisplay }}{{ suffix(key) }}
      </span>
    </div>
  }

  @for (key of bonusRows(); track key) {
    <div
      class="flex items-center gap-1"
      [class.text-value-positive]="bonusValue(key) > 0"
      [class.text-value-negative]="bonusValue(key) < 0"
    >
      <app-icon [name]="icon(key)" size="stat" />
      <span>
        {{ label(key) }}: {{ bonusValue(key) | statDisplay }}{{ suffix(key) }}
      </span>
    </div>
  }
</div>
