<app-modal
  modalId="combat-orders"
  [showCloseButton]="true"
  [allowEscToClose]="true"
  [closeOnBackdropClick]="true"
  [widthClass]="'max-w-5xl'"
  (modalClose)="resetProps()"
>
  <span title>{{ 'modalHeroCombatOrders.combatOrders' | t }}</span>

  <div body class="flex flex-col gap-4">
    @if (isManualCombat()) {
      <div class="alert alert-info">
        {{ 'modalHeroCombatOrders.underTaskmasterSIntervention' | t }}
      </div>
    }
    @if (character(); as hero) {
      <app-panel-hero-combat-orders
        [character]="hero"
        [party]="party()"
        [clauses]="clauses()"
        (add)="add(hero, $event)"
        (update)="update(hero, $event)"
        (remove)="remove(hero, $event)"
        (reorder)="reorder(hero, $event)"
        (toggleEnabled)="toggleEnabled(hero, $event)"
      />
    } @else {
      <app-blank-slate>
        {{ 'modalHeroCombatOrders.noHeroSelected' | t }}
      </app-blank-slate>
    }
  </div>
</app-modal>
