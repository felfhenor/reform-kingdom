<app-modal
  modalId="hero-burst-skills"
  widthClass="max-w-2xl"
  [showCloseButton]="true"
  [allowEscToClose]="true"
  [closeOnBackdropClick]="true"
>
  <span title>{{ 'modalHeroBurstSkills.burstSkill' | t }}</span>

  @if (chosenId()) {
    <button
      titleActions
      type="button"
      class="btn btn-sm btn-error btn-outline"
      (click)="unset()"
      appSfx="ui-error"
      [sfxTrigger]="['click', 'hover']"
    >
      {{ 'modalHeroBurstSkills.unset' | t }}
    </button>
  }

  <p subtitle>{{ 'modalHeroBurstSkills.burstSkillsSpendElements' | t }}</p>

  <div body class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto pr-2">
    @if (character(); as hero) {
      <app-panel-hero-burst-skills
        [character]="hero"
        (choose)="choose(hero, $event)"
      />
    } @else {
      <app-blank-slate>
        {{ 'modalHeroBurstSkills.thisHeroHasnT' | t }}
      </app-blank-slate>
    }
  </div>
</app-modal>
