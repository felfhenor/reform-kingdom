titleCrawl:
  paragraph1: Once, there was a kingdom.
  paragraph2: The Founder formed it from nothing, setting a single stone at its heart. While the Founding Stone stood firm, the paths, towers, rivers and forests stayed within sight. Thus, the kingdom came to life.
  paragraph3: Then came the Sundering. The Founding Stone cracked, and slowly, the kingdom became fractured.
  paragraph4: The land began to forget itself. Paths became lost, towers vanished, rivers ran dry, and forests thinned. Those who left the kingdom never found their way back.
  paragraph5: Beyond the Felway lies Fel, the Demon of Forgetting. The Sundering was his doing, and his wish is for everything to be forgotten.
  paragraph6: 'Only the Duchy of Carrina remembered. There, beside the fractured Founding Stone, the Founder still rules: unseen, but not unheard.'
  paragraph7: Now, the Founder has issued a decree. You have a party of heroes, the Founder's authority, and a great deal of paperwork. You must help find the lost, rebuild what is broken, and re-form the kingdom.
outroCrawl:
  paragraph1: Fel, the Forgetter, has fallen.
  paragraph2: Without him, his demons scatter back toward the Pale. The Astral Observatory collapses and the land he forgot begins, slowly, to remember itself.
  paragraph3: The memories he devoured will slowly find their way home. The sands of Larsia recall the soil beneath them. The Erden trees recall how to grow. The mire, the mountains and the frozen summit each recall their own shape.
  paragraph4: The Founding Stone is still cracked. It may never recover from that. But a kingdom was never only a stone - it is roads that lead somewhere, towns that trade, and travelers who explore. The damage may never be fully undone, but together with the Founder, you can mend the scars.
  paragraph5: 'In Carrina, the Founder reads your final report and issues one more decree: the work will continue. You both know the work will never be done.'
  paragraph6: There are still the lost to find, roads to mend, and, as ever, a great deal of paperwork.
  paragraph7: Once, there was a kingdom - expansive and diverse. Thanks to you, there still is.
