- id: ef34cc15-c137-4d75-b21d-0da30f4c1ab6
  name: Inferno
  family: Inferno
  description: Engulf every enemy in a blazing heat for {{ value }} fire damage, inflicting them all with Burning.

  sprite: '0052'

  rarity: Rare

  epCost: 0
  usesPerCombat: -1

  special: true
  cooldown: 4

  elementCosts:
    Fire: 2

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
    - elements: [Fire]
      attributes: [DamagesTarget, AllowPlink, CanBeReflected, Debuff]
      targets: 4
      targetType: Enemies
      targetBehaviors:
        - behavior: NotZeroHealth
      damageScaling:
        Intelligence: 1.2

      statusEffects:
        - statusEffectId: Burning
          chance: 100
          duration: 3

      combatMessage: '**{{ combatant.name }}** uses **{{ skill.name }}** on **{{ target.name }}** for {{ damageText }} ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'

