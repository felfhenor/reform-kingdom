- id: 4a2103cb-a704-46b2-8168-7f39b184851f
  name: Slow Web I
  description: Web an enemy, slowing them down.

  sprite: '0010'

  rarity: Common

  epCost: 6
  usesPerCombat: -1

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
    - attributes: [DamagesTarget, AllowPlink]
      elements: []
      targets: 1
      targetType: Enemies
      targetBehaviors:
        - behavior: NotZeroHealth
        - behavior: IfNotStatusEffect
          statusEffectId: Slowed
      damageScaling:
        Strength: 0.5

      statusEffects:
        - statusEffectId: Slowed
          chance: 100
          duration: 3

      combatMessage: '**{{ combatant.name }}** uses **{{ skill.name }}** on **{{ target.name }}** for {{ damage }} damage ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'

