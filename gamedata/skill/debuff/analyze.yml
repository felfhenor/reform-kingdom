- id: 6d24b4d1-544a-48e6-90a5-967cee3fe653
  name: Analyze I
  family: Analyze
  description: Analyze the weak spot of an enemy, inflicting Weakspot.

  sprite: '0006'

  rarity: Common

  epCost: 4
  usesPerCombat: -1

