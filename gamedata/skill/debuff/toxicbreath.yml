- id: 97a5da3d-5784-40cc-a47e-7dd55c28491d
  name: Toxic Breath
  family: Toxic Breath
  description: Breathe toxicity at 3 foes for {{ value }} damage, and inflicting them with Disgusted.

  sprite: '0027'

  rarity: Common

  epCost: 12
  usesPerCombat: -1

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
    - attributes: [DamagesTarget, AllowPlink, AllowLuckDodge, Debuff]
      elements: []
      targets: 3
      targetType: Enemies
      targetBehaviors:
        - behavior: NotZeroHealth
        - behavior: IfNotStatusEffect
          statusEffectId: Disgusted
      damageScaling:
        Inteligence: 0.5
        Strength: 0.5

      statusEffects:
        - statusEffectId: Disgusted
          chance: 100
          duration: 3

      combatMessage: '**{{ combatant.name }}** uses **{{ skill.name }}** on **{{ target.name }}** for {{ damage }} damage ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'
