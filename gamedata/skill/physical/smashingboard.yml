  family: Smashing Board
  description: Smash your shield into an enemy, dealing {{ value }} damage and inflicting Dazed on them.

  rarity: Common
  sprite: '0022'

  epCost: 5
  usesPerCombat: -1

  requiredWeaponTypes: [Shield]

  statusEffectDurationBoost: {}
