- id: a2b6fd51-642a-4147-aa28-f41da85643e8
  name: Regrowth I
  family: Regrowth
  description: Heal 2+ living allies for a total of {{ value }} HP.

  sprite: '0031'

  rarity: Common

  epCost: 16
  usesPerCombat: -1

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
    - elements: [Earth]
      attributes: [BypassDefense, NeverMisses, HealsTarget]
      targets: 2
      targetType: Allies
      targetBehaviors:
        - behavior: NotZeroHealth
        - behavior: NotMaxHealth
      damageScaling:
        Agility: 1
        Intelligence: 0.5

      combatMessage: '**{{ combatant.name }}** cast **{{ skill.name }}** on **{{ target.name }}** for {{ absdamage }} healing ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'

    - elements: [Water]
      attributes: [BypassDefense, NeverMisses, HealsTarget]
      targets: 2
      targetType: Allies
      targetBehaviors:
