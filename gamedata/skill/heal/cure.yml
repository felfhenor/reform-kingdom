- id: ed42f2b8-1722-4af2-b36b-7d40318fa725
  name: Cure I
  description: Heal a living ally for a small amount of HP.

  sprite: '0004'

  rarity: Common

  epCost: 3
  usesPerCombat: -1

  techniques:
    - elements: [Water]
      attributes: [BypassDefense, HealsTarget]
      targets: 1
      targetType: Allies
      targetBehaviors:
        - behavior: NotZeroHealth
        - behavior: NotMaxHealth
      damageScaling:
        Intelligence: 0.5
        Vitality: 0.25

      combatMessage: '**{{ combatant.name }}** cast **{{ skill.name }}** on **{{ target.name }}** for {{ absdamage }} healing ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'

