- id: 07c04cff-c671-4a5c-b646-81dcb08c899c
  name: Chilling Touch I
  family: Chilling Touch
  description: Chill a foe with your touch, dealing {{ value }} damage and inflicting Brittle.

  sprite: '0023'

  rarity: Common

  epCost: 10
  usesPerCombat: -1

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
    - elements: [Water]
      attributes: [DamagesTarget, AllowPlink]
      targets: 1
      targetType: Enemies
      targetBehaviors:
        - behavior: NotZeroHealth
        - behavior: IfNotStatusEffect
          statusEffectId: Brittle I
        - behavior: IfNotStatusEffect
          statusEffectId: Brittle II
      damageScaling:
        Intelligence: 1
        Strength: 0.5

      statusEffects:
        - chance: 100
          statusEffectId: Brittle I
          duration: 3

      combatMessage: '**{{ combatant.name }}** uses **{{ skill.name }}** on **{{ target.name }}** for {{ damage }} damage ({{ target.hp }}/{{ target.totalStats.Health }} HP remaining).'

