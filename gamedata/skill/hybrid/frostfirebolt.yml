  family: Frostfire Bolt
  description: Blast a single enemy with frost and fire, dealing {{ value }} damage with a chance of inflicting Burning and Chilled on the enemy.

  sprite: '0019'

  rarity: Common

  epCost: 7
  usesPerCombat: -1

  statusEffectDurationBoost: {}
  statusEffectChanceBoost: {}

  techniques:
