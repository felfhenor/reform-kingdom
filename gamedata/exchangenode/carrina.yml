- id: af46ea50-4dff-4ee0-b9a1-c586e250bfb1
  name: Alerian Exchange
  description: A place where those of Carrina go to exchange with visitors from lands far and near. Here, they exchange the various resources they have for things more esoteric.
  background: castle-hall-windows
  emptyText: You do not have anything that can be exchanged here.
  actionLabel: Exchange

  exchanges:
