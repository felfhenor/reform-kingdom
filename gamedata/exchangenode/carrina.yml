      input:
        itemId: Copper Ore
        required: 25

      output:
        itemId: Pumpkin Gem
        quantity: 1

      costs:
        - itemId: Gold Coin
          required: 500

    - kind: Item
      input:
        itemId: Wergen Stick
        required: 25

      output:
        itemId: Small Goblin Bone
        quantity: 1

      costs:
        - itemId: Gold Coin
          required: 500

    - kind: Item
      input:
        itemId: Wergen Wood
        required: 25

