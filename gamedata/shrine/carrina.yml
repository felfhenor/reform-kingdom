- id: 8e7cc8d1-ffce-4ec9-876e-a194713bf08a
  name: Shrine of the Founder
  description: A shrine dedicated to the Founder. It helps new adventurers and old ones alike to recognize their experiences and learn more from them.
  legendName: Legend of the Founder
  founderWhispers: true

  levels:
    - developTime: 300
      costs:
        - itemId: Gold Coin
          required: 500

      globalEffectId: Wisdom of the Founder I
      globalEffectDuration: 1800
      legend: Before the kingdom, there wasn't anything worth naming. The Founder saw a different world, a different way.

    - developTime: 600
      costs:
        - itemId: Gold Coin
          required: 10000

        - itemId: Wergen Wood
          required: 25

        - itemId: Copper Ingot
          required: 25

        - itemId: Malachite
          required: 25

      globalEffectId: Wisdom of the Founder II
      globalEffectDuration: 3600
      legend: With the light of the Founding Stone, the second sun, the Founder saw the world as it could be. The world remembered; the Founder could rest easier.

    - developTime: 900
      costs:
        - itemId: Gold Coin
          required: 25000

        - itemId: Tattered Hide
          required: 25

        - itemId: Small Goblin Bone
          required: 25

        - itemId: Goblin Teeth
          required: 25

      globalEffectId: Wisdom of the Founder III
      globalEffectDuration: 7200
      legend: The Founder brought in those who could help the lands grow. Under their combined leadership, the lands prospered. Their shrines still stand, their wisdom burning bright.

    - developTime: 1200
      costs:
        - itemId: Gold Coin
          required: 65000

        - itemId: Weak Spider Silk
          required: 25

        - itemId: Azurite
          required: 25

        - itemId: Pumpkin Gem
          required: 5

      globalEffectId: Wisdom of the Founder IV
      globalEffectDuration: 14400
      legend: The cracking of the stone - the Sundering - did not happen all at once. Every crack was another river lost, another path forgotten.

    - developTime: 1500
      costs:
        - itemId: Gold Coin
          required: 150000

        - itemId: Orc Bone
          required: 25

        - itemId: Small Asura Tendon
          required: 25

        - itemId: Trislime Core
          required: 5

        - itemId: Gobslime Tongue
          required: 3

      globalEffectId: Wisdom of the Founder V
      globalEffectDuration: 31536000
      legend: To this day, none have laid eyes on the Founder. Those who serve the Founder hear the whispers on the wind. For them, this suffices.

- id: 21a576a8-b4d2-467c-8a06-d7020757ec25
  name: Shrine of Izchak
  description: A shrine erected by local merchants. They say that praying here increases your wealth.
  legendName: Legend of the Magnate

  levels:
    - developTime: 300
      costs:
        - itemId: Gold Coin
          required: 500

      globalEffectId: Triumph of the Magnate I
      globalEffectDuration: 1800
      legend: Izchak was the most trusted merchant in the kingdom. He knew how to value anything with coin - even a promise from the Founder.

    - developTime: 600
      costs:
        - itemId: Gold Coin
          required: 25000

      globalEffectId: Triumph of the Magnate II
      globalEffectDuration: 3600
      legend: Building the kingdom was no easy task. Izchak made sure the funds were there. No one knows how.

    - developTime: 900
      costs:
        - itemId: Gold Coin
          required: 100000

      globalEffectId: Triumph of the Magnate III
      globalEffectDuration: 7200
      legend: Folk tales say that Izchak tried to teach economics to the goblins. They just took the coins. Now, every creature in the land has coin.

    - developTime: 1200
      costs:
        - itemId: Gold Coin
          required: 250000

      globalEffectId: Triumph of the Magnate IV
      globalEffectDuration: 14400
      legend: The distant lands may have forgotten themselves with the Sundering, but Izchak's ledgers prove they existed. A shame they outlived him.

    - developTime: 1500
      costs:
        - itemId: Gold Coin
          required: 1000000

      globalEffectId: Triumph of the Magnate V
      globalEffectDuration: 31536000
      legend: Passing merchants leave a coin here for good luck. Mysteriously, there's never too much money at the shrine.
