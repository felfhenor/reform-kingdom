# Damage-vs-monster-type prefixes. Each MonsterType gets a Common "-Hurting" (+10%) and an Uncommon "-Slaying" (+20%) tier sharing a family, so an item rolls at most one of the pair.

- id: 624daff5-3f7c-4691-9cb8-d47514390d8d
  name: Humanoid-harming
  description: Increases damage dealt to Humanoid enemies by 10%.
  rarity: Common
  family: HumanoidSlaying
  position: Prefix
  effects:
    - kind: MonsterTypeDamage
      monsterType: Humanoid
      value: 10

