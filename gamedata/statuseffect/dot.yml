- id: 8257c648-a378-4213-83d1-94f10fdc9258
  name: Burning

  effectType: Debuff
  elements: [Fire]

  trigger: TurnEnd

  statScaling:
    Intelligence: 0.2

  onApply:
    - type: SendMessage
      combatMessage: '**{{ combatant.name }}** has been burned!'

  onTick:
    - type: TakeDamage
      combatMessage: '**{{ combatant.name }}** is burning for {{ damage }} damage ({{ combatant.hp }}/{{ combatant.totalStats.Health }} HP remaining).'
