- id: 3353a9c5-176a-4b64-817d-76b674eed7d9
  name: Mons Oblitus
  description: A forgotten mountain, rebuilt through Fel's memory of the valley. Here exists a fragment of Fel, enmeshed with his own kind. They, too, may be forgotten with time.
  combatBackground: sky-temple
  levelRange:
    min: 60
    max: 63

  fights:
    - monsters:
        - monsterId: Demon Knight
        - monsterId: Forgetter of the Peaks
        - monsterId: Fel Demon
      postFightWhisper: Maybe now the valley will remember...

  completionRewards:
    - collectibleId: Memory of the Ritualists
      chance: 100

- id: 3ad978d9-a758-415f-b7f6-91bb8a4deb4c
  name: Glacis Oblitus
  description: A forgotten snowscape, rebuilt through Fel's memory of the summit. Here, a fragment of Fel will try to forget even the cold, biting winds.
  combatBackground: arena-snow
  combatBackgroundFilter: Astral
  levelRange:
    min: 60
    max: 63

  fights:
    - monsters:
        - monsterId: Frost Golem
        - monsterId: Forgetter of the Frost
        - monsterId: Vengeful Spirit
      postFightWhisper: No one can truly forget the harsh winds. Not even Fel.

  completionRewards:
    - collectibleId: Memory of the Hungry
      chance: 100

- id: 6bcef894-2408-4cd4-9ed7-524739fa3407
  name: Pulvis Oblitus
  description: A forgotten desert, rebuilt through Fel's memory of the sands. The land forgot how to grow plantlife, and in time, it may forget itself.
  combatBackground: desert-ruins
  combatBackgroundFilter: Astral
  levelRange:
    min: 60
    max: 63

  fights:
    - monsters:
        - monsterId: Akroki Vanguard
        - monsterId: Forgetter of the Sands
        - monsterId: Akroki Mage
      postFightWhisper: I'm sure the sands will now remember how to be soil, and soon Medina's flowers will return.

  completionRewards:
    - collectibleId: Memory of the Land
      chance: 100

- id: ce958e1c-1ce1-4566-b25e-3ab52cc9728a
  name: Lutum Oblitus
  description: A forgotten bog, rebuilt through Fel's memory of the mire. Here, Fel will try to forget the terrible stench and all contained by it.
  combatBackground: swamp-roots
  combatBackgroundFilter: Astral
  levelRange:
    min: 60
    max: 63

  fights:
    - monsters:
        - monsterId: Banshee
        - monsterId: Forgetter of the Mire
        - monsterId: Toxic Toad
      postFightWhisper: Maybe now the bog will be lush again. Or maybe the orcs want it how it is.

  completionRewards:
    - collectibleId: Memory of the Fallen
      chance: 100

- id: e999e12e-e21d-4760-9b5f-6c4f02db2ab4
  name: Arbor Oblitus
  description: A forgotten forest, rebuilt through Fel's memory of the woodland. Here, the trees forget being cut down. They forget growing. Soon, Fel will try to make them forget sprouting, too.
  combatBackground: forest-magic
  combatBackgroundFilter: Astral
  levelRange:
    min: 60
    max: 63

  fights:
    - monsters:
        - monsterId: Woodwolf
        - monsterId: Forgetter of the Forest
        - monsterId: Woodspider
      postFightWhisper: Now, the forest will grow again. The elves will be thrilled.

  completionRewards:
    - collectibleId: Memory of the Hunters
      chance: 100

- id: 06df087c-cc8b-4b30-97c8-143ce6ec3944
  name: Forgetter's Fane
  description: A temple dedicated to the Forgetter. Here, he surrounds himself with all he tries to forget. It's both his greatest weakness and his strongest power.
  combatBackground: sky-castle
  levelRange:
    min: 67
    max: 70

  fights:
    - monsters:
        - monsterId: Fragment of Fel
      postFightWhisper: He's losing part of himself to try to slow you down. Good. That means he's afraid.
      postFightDelay: 5

    - monsters:
        - monsterId: Fel, the Forgetter
      postFightWhisper: That was the face he shows the world. What comes next is the one he hides. Steady now.
      postFightDelay: 5

    - monsters:
        - monsterId: Fel Fhenor
      postFightWhisper: It's done. The demons will disappear without him. The Stone is still cracked, but we can work around that. Back to work.
      postFightDelay: 5

  completionRewards:
    - collectibleId: Memory of the Forgetter
      chance: 100

    - equipmentId: Forgetter's Amulet
      chance: 100
