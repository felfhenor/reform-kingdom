# Demo build content rules (`npm run build:demo`). Single entries can also opt out with `demoStrip: true`.

# Only these maps ship; any map not listed (including new ones) is stripped.
maps:
  - Carrina
  - CraggledMire

# Every gamedata file whose path (relative to gamedata/) contains one of these is stripped.
stripFiles:
  - astralobservatory
  - erdenwoodland
  - felsummit
  - felway
  - larsiandesert
  - templarsretreat
  - larsia
  - town/elfheim
  - town-elfheim
  - elfhelm
  - lizard
  - foundersblessed
  - smugglers
  - caravantrader/fel.yml

# Kept despite a stripFiles match, because demo content still uses them.
keep:
  # Ghostcopper gear sold by Mire traders and the Shrine of Parcilyte's upgrades
  - Ghostcopper Dust
  # Felway Gate (Carrina) and Look for Trouble II's summon
  - Fel Demon
  - Akroki Vanguard
  # Pond of Memories costs that the demo does produce
  - Hawk Feather
  - Star Fragment

# Kept because the Pond of Memories and Stori Kesan name them, but nothing in the demo produces them.
# Cascade content that needs them is stripped and prune lists drop them, like stripped content.
unobtainable:
  - Brightwisp Core
  - Cactspine
  - Cimmerian Fire Charm
  - Cimmerian Holy Charm
  - Cimmerian Lightning Charm
  - Cimmerian Skull Charm
  - Cimmerian Water Charm
  - Crimson Ingot
  - Crimson Ruby
  - Felrock
  - Firmwater
  # Named by achievements and shrines, which ship as they do in release
  - Baselard of Izchak
  - Memory of the Akroki
  - Memory of the Cimmerians
  - Memory of the Fel
  - Memory of the Forgetter
  - Memory of the Guardians
  - Spear of Parcilyte
  - Sword of the Founder

# Kept entries in these folders are stripped too once they need a stripped map, node or entry (they can't be finished).
cascade:
  - task
  - rumor
  - recipe
  - astralprojector
  - trainerteaching
  - skill

# List fields whose elements are dropped (instead of failing) when they need stripped content.
prune:
  monster:
    - drops
  caravantrader:
    - tokenTrades
    - trades
  exchangenode:
    - exchanges
  trainer:
    - trainerTeachingIds

# Kept entries in these folders are stripped once no kept content references them (nothing can produce them).
orphans:
  - equipment
  - collectible

# Looked up by name in code, so the demo build fails if any of these get stripped.
pinned:
  - Gold Coin
  - Crimson Lucre
  - Trader Scrip
  - Memory Flux
  - Duskhall Flux
  - Founding Stone
  - Recipe Backdrop
  - Rumor
  - Attack
  - Auto Mode
  - Deaths Door
  - Healing
  - Idle
  - Raid Defense Requested
  - Regional Outpost
  - Trepidation
